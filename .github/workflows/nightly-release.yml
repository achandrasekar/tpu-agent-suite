# Nightly build of the standalone per-harness release archives, following the
# canonical release process: stamp the version in
# package/package.release.json, `make test`, `make archives`, and publish the
# resulting dist/archives/*.tar.gz to
#   gs://gh_zips/releases/nightly/<version>/   (one directory per build)
#   gs://gh_zips/releases/nightly/latest/      (replaced on each publish)
# The bucket (project tpu-nexus-767207) is private; readers need
# storage.objectViewer on it. PR runs build and smoke-test but never publish.
name: nightly-release
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Makefile'
      - '.github/workflows/nightly-release.yml'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GCS_RELEASE_ROOT: gs://gh_zips/releases/nightly
      PUBLISH: ${{ github.event_name != 'pull_request' && secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r cicd-requirements.txt

      # VERSION="<current-version>.dev<datetime>". package.release.json is the single
      # source of the release version: it flows into every build manifest and
      # into the archive filenames. Rewrite only the version literal so the
      # rest of the file keeps its formatting.
      - name: Stamp nightly version
        id: version
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re
          src = pathlib.Path("package/package.release.json")
          text = src.read_text()
          current = json.loads(text)["version"]
          stamp = datetime.datetime.now(datetime.UTC).strftime("%Y%m%d%H%M")
          nightly = f"{current}.dev{stamp}"
          text, n = re.subn(r'("version"\s*:\s*)"[^"]+"', rf'\g<1>"{nightly}"',
                            text, count=1)
          assert n == 1, "version field not found in package.release.json"
          src.write_text(text)
          assert json.loads(src.read_text())["version"] == nightly
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={nightly}\n")
          print(f"{current} -> {nightly}")
          PY

      - name: Test
        run: make test

      - name: Build release archives
        run: make archives

      # Install from an extracted archive exactly as an end user would, so a
      # broken self-contained installer fails the nightly instead of shipping.
      # The runner has no Claude Code, so skip the installer's probe of its CLI.
      - name: Smoke test the claude-code archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/archives/tpu-agent-suite-claude-code-v${VERSION}.tar.gz"
          test -f "$archive"
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          dist="$work/tpu-agent-suite-claude-code-v${VERSION}"
          mkdir -p "$work/project"
          git init -q "$work/project"
          HOME="$work/home" python3 "$dist/framework/installer.py" \
            install --destination "$work/project" \
            --non-interactive --skip-host-check --skip-harness-check
          # Install sets up no compute; the runtime saves a profile.
          central=("$work"/home/.tpu-agent-suite/packages/tpu-agent-suite@*)
          (cd "$work/project" && HOME="$work/home" python3 \
            "${central[0]}/framework/runtime.py" compute \
            --package "$(basename "${central[0]}")" \
            setup apply --profile default --answers '{"backend": "local"}')

      # Kept alongside GCS: a copy on the run page for debugging, and the only
      # output of PR runs, which never publish.
      - name: Upload nightly archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tpu-agent-suite-${{ steps.version.outputs.version }}
          path: dist/archives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to Google Cloud
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # The versioned directory is written first and never overwritten, so a
      # failure part-way leaves `latest/` on the previous good build. VERSION
      # is a single file naming the build `latest/` holds, since the archive
      # filenames inside it carry the timestamp.
      - name: Publish to GCS
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Publishing as: $(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")"
          cd dist/archives
          sha256sum -- *.tar.gz > SHA256SUMS
          echo "$VERSION" > VERSION
          dest="${GCS_RELEASE_ROOT}/${VERSION}"
          # --no-clobber skips existing objects and still exits 0, so a colliding
          # version would re-mirror the old build as if it were new.
          if gcloud storage ls "$dest/" >/dev/null 2>&1; then
            echo "::error::$dest already exists; nightly ${VERSION} is already published"
            exit 1
          fi
          gcloud storage cp --no-clobber ./*.tar.gz SHA256SUMS VERSION "$dest/"
          gcloud storage rsync --delete-unmatched-destination-objects \
            "$dest" "${GCS_RELEASE_ROOT}/latest"
          {
            echo "## Nightly release \`${VERSION}\`"
            echo
            echo "| Archive | Location |"
            echo "| :--- | :--- |"
            for f in *.tar.gz; do echo "| \`$f\` | \`$dest/$f\` |"; done
            echo
            echo "Also mirrored at \`${GCS_RELEASE_ROOT}/latest/\`."
          } >> "$GITHUB_STEP_SUMMARY"
