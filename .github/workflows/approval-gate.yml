name: Approval Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

jobs:
  check-approvals:
    name: Check Approval Rules
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Validate PR Approvals
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rules = [
              {
                name: 'tpu-model-onboarding',
                // The layout by kind: what was one directory is an
                // agent, its helper, and the two directories they read and
                // run.
                prefixes: [
                  'package/agents/tpu-model-onboarding.md',
                  'package/agents/tpu-unwiring.md',
                  'package/references/tpu-model-onboarding',
                  'package/scripts/tpu-model-onboarding'
                ],
                maintainers: [
                  'v-dziuba',
                  'saikalv',
                  'larsnathan',
                  'prksandeep',
                  'learning-to-play'
                ]
              },
              {
                name: 'framework',
                prefixes: [
                  'framework'
                ],
                maintainers: [
                  'jrplatin',
                  'learning-to-play',
                  'prksandeep'
                ]
              },
              {
                name: 'docs',
                prefixes: [
                  'docs'
                ],
                maintainers: [
                  'prksandeep',
                  'jrplatin',
                  'learning-to-play',
                  'mrasquinha-g'
                ]
              }
            ];

            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prAuthor = pr.user.login.toLowerCase();
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Fetch all modified files in this PR
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber }
            );
            const filePaths = files.map(f => f.filename);

            // 2. Determine which protected areas the PR modifies
            const touchedRules = rules
              .map(rule => ({
                ...rule,
                files: filePaths.filter(f =>
                  rule.prefixes.some(prefix => f === prefix || f.startsWith(`${prefix}/`))
                )
              }))
              .filter(rule => rule.files.length > 0);

            // 3. Fetch all reviews and get latest state per reviewer
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber }
            );

            // Map each reviewer to their most recent review state
            const latestReviewMap = new Map();
            for (const r of reviews) {
              latestReviewMap.set(r.user.login.toLowerCase(), r.state);
            }

            const approvers = [];
            for (const [user, state] of latestReviewMap.entries()) {
              if (state === 'APPROVED') {
                approvers.push(user);
              }
            }

            core.info(`PR #${prNumber} Author: @${prAuthor}`);
            core.info(`PR #${prNumber} modified files: ${filePaths.join(', ')}`);
            core.info(`Current Approvers: ${approvers.join(', ') || 'None'}`);

            // 4. Evaluate Policy
            if (approvers.length < 1) {
              core.setFailed(`⏳ Pending: Changes require at least 1 approval.`);
              return;
            }

            if (touchedRules.length === 0) {
              core.info(`✅ Approval Gate Passed: Changes do not touch protected areas and are approved by: ${approvers.join(', ')}.`);
              return;
            }

            const blocked = [];
            for (const rule of touchedRules) {
              const ruleMaintainers = rule.maintainers.map(m => m.toLowerCase());

              if (ruleMaintainers.includes(prAuthor)) {
                core.info(`✅ PR author @${prAuthor} is a maintainer for ${rule.name} and PR is approved by: ${approvers.join(', ')}.`);
                continue;
              }

              const maintainerApprover = approvers.find(u => ruleMaintainers.includes(u));
              if (maintainerApprover) {
                core.info(`✅ Maintainer @${maintainerApprover} approved changes to ${rule.name}.`);
              } else {
                blocked.push(
                  `🚫 Blocked: PR modifies files in ${rule.name} (${rule.files.join(', ')}).\n` +
                  `Approval from one of [${rule.maintainers.map(m => `@${m}`).join(', ')}] is required.`
                );
              }
            }

            if (blocked.length > 0) {
              core.setFailed(blocked.join('\n'));
            } else {
              core.info(`✅ Approval Gate Passed: All protected areas approved by their maintainers.`);
            }
