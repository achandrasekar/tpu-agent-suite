name: Baseline Post-Merge Evaluations
run-name: >-
  Baseline Post-Merge (${{ github.ref_name }} | ${{ inputs.config || 'all' }} | ${{ inputs.task || 'all' }})
on:
  push:
    branches:
      - main
    paths:
      - 'eval/configs/agy/baseline-shared-capacity-remote.yaml'
      - 'eval/configs/claude-code/baseline-shared-capacity-remote.yaml'
      - 'eval/datasets/nightly-onboard-optimize/*/instruction.md'
  workflow_dispatch:
    inputs:
      config:
        description: 'Harbor Baseline Job Configuration'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'claude-code/baseline-shared-capacity-remote'
          - 'agy/baseline-shared-capacity-remote'
      task:
        description: 'Task to evaluate (or "all" for full nightly-onboard-optimize dataset)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'nightly-onboard-optimize/onboarding-qwen3-8-27b'
          - 'nightly-onboard-optimize/onboarding-gemma-4-31b-it'
          - 'nightly-onboard-optimize/onboarding-mistral-small-24b'
          - 'nightly-onboard-optimize/onboarding-gpt-oss-20b'
          - 'nightly-onboard-optimize/tpu-inference-gemma-4-31b-it-vllm'
          - 'nightly-onboard-optimize/tpu-inference-gpt-oss-20b-vllm'
          - 'nightly-onboard-optimize/tpu-inference-qwen3-8-27b-vllm'
      upload_to_hub:
        description: 'Upload results to Harbor Hub'
        required: false
        type: boolean
        default: true
      vertex_ai_project:
        description: 'Vertex AI project for Claude Code & Anthropic models access'
        required: false
        default: 'tpu-nexus-767207'
      vertex_ai_location:
        description: 'Vertex AI location'
        required: false
        default: 'global'

# A step in a `container:` job defaults to `sh`; set `bash` as the default shell.
defaults:
  run:
    shell: bash

# checkout uses a detached merge commit for PRs; record the contributor's commit.
env:
  EVAL_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  detect-changed-targets:
    name: detect changed baseline targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cc_tasks: ${{ steps.detect.outputs.cc_tasks }}
      agy_tasks: ${{ steps.detect.outputs.agy_tasks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changed configs and task prompts
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIG_INPUT: ${{ github.event.inputs.config || 'all' }}
          TASK_INPUT: ${{ github.event.inputs.task || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          root = pathlib.Path("eval/datasets/nightly-onboard-optimize")
          event_name = os.environ.get("EVENT_NAME", "")
          config_input = os.environ.get("CONFIG_INPUT", "all") or "all"
          task_input = os.environ.get("TASK_INPUT", "all") or "all"

          def lpt_key(task: str) -> tuple[int, str]:
              name = task.rsplit("/", 1)[-1]
              rank = 0 if name.startswith("tpu-inference-") else 1 if name.startswith("onboarding-") else 2
              return (rank, task)

          all_tasks = sorted(
              (f"nightly-onboard-optimize/{p.parent.name}" for p in root.glob("*/task.toml")),
              key=lpt_key,
          )

          changed_tasks = []
          cc_mode = "none"
          agy_mode = "none"
          cc_tasks = []
          agy_tasks = []

          if event_name == "push":
              out = subprocess.run(
                  ["git", "diff", "--name-only", "--diff-filter=AMR", "HEAD^1", "HEAD"],
                  capture_output=True, text=True, check=True
              )
              changed_files = set(out.stdout.splitlines())
              prompt_re = re.compile(r"^eval/datasets/nightly-onboard-optimize/([a-z0-9-]+)/instruction\.md$")
              matched = set()
              for f in changed_files:
                  m = prompt_re.match(f)
                  if m and (root / m.group(1) / "task.toml").is_file():
                      matched.add(f"nightly-onboard-optimize/{m.group(1)}")
              changed_tasks = sorted(matched, key=lpt_key)

              if "eval/configs/claude-code/baseline-shared-capacity-remote.yaml" in changed_files:
                  cc_mode = "dataset"
                  cc_tasks = all_tasks
              elif changed_tasks:
                  cc_mode = "tasks"
                  cc_tasks = changed_tasks

              if "eval/configs/agy/baseline-shared-capacity-remote.yaml" in changed_files:
                  agy_mode = "dataset"
                  agy_tasks = all_tasks
              elif changed_tasks:
                  agy_mode = "tasks"
                  agy_tasks = changed_tasks
          else:
              selected = all_tasks if task_input == "all" else [task_input]
              mode_val = "dataset" if task_input == "all" else "tasks"
              if config_input in ("all", "claude-code/baseline-shared-capacity-remote"):
                  cc_mode = mode_val
                  cc_tasks = selected
              if config_input in ("all", "agy/baseline-shared-capacity-remote"):
                  agy_mode = mode_val
                  agy_tasks = selected

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"cc_tasks={json.dumps(cc_tasks)}\n")
              fh.write(f"agy_tasks={json.dumps(agy_tasks)}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Baseline post-merge targets\n\n")
              fh.write(f"- `claude-code`: `{cc_mode}` ({len(cc_tasks)} tasks)\n")
              fh.write(f"- `agy`: `{agy_mode}` ({len(agy_tasks)} tasks)\n")
              if changed_tasks:
                  fh.write("- Changed prompt tasks:\n")
                  for t in changed_tasks:
                      fh.write(f"  - `{t}`\n")
          PY

  claude-code-baseline-eval:
    name: claude-code baseline (${{ matrix.task }})
    needs: [detect-changed-targets]
    if: >-
      !cancelled() && needs.detect-changed-targets.result == 'success' &&
      needs.detect-changed-targets.outputs.cc_tasks != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJson(needs.detect-changed-targets.outputs.cc_tasks) }}
    concurrency:
      group: cc-baseline-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: linux-x86-agent-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    timeout-minutes: 1440
    permissions:
      contents: read
      id-token: write

    env:
      UPLOAD_TO_HUB: ${{ github.event.inputs.upload_to_hub || 'true' }}
      VERTEXAI_PROJECT: ${{ github.event.inputs.vertex_ai_project || 'tpu-nexus-767207' }}
      VERTEXAI_LOCATION: ${{ github.event.inputs.vertex_ai_location || 'global' }}
      GKE_AUTH_ACCOUNT: metadata
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          ./eval/setup.sh
          echo "$GITHUB_WORKSPACE/eval/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # No get-gke-credentials step: eval/run.py mints its own
      # single-context kubeconfig and strips the gke-gcloud-auth-plugin exec
      # block, which the eval container cannot run. A kubeconfig written here
      # would go unread.

      # GCP auth comes from the runner's GKE metadata server (Workload
      # Identity), not ADC: GKE_AUTH_ACCOUNT=metadata is set in env, and
      # run.py refuses to run if an ADC file is present.
      - name: Check GKE metadata server identity
        run: |
          email=$(curl -sf -H "Metadata-Flavor: Google" \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email) || {
            echo "::error::GKE metadata server unreachable from this job"; exit 1; }
          echo "==> [auth] GKE metadata server service account: $email"
          adc="$HOME/.config/gcloud/application_default_credentials.json"
          if [ -f "$adc" ]; then
            echo "::error::ADC found at $adc; this run must not use ADC"; exit 1
          fi
          echo "==> [auth] no ADC at $adc"

      - name: Verify Evaluation Setup (Schema & Task Check)
        run: |
          ./eval/verify.sh nightly-onboard-optimize

      - name: Run Claude Code Baseline Harbor Evaluation
        env:
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_AUTH }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_AUTH }}
          VERTEXAI_PROJECT: ${{ env.VERTEXAI_PROJECT }}
          VERTEXAI_LOCATION: ${{ env.VERTEXAI_LOCATION }}
          HARBOR_IMPERSONATE_SA: 141197224043-compute@developer.gserviceaccount.com
          GKE_IMPERSONATE_SA: harbor-ci-runner@tpu-nexus-767207.iam.gserviceaccount.com
          MATRIX_TASK: ${{ matrix.task }}
        run: |
          UPLOAD_FLAG="--no-upload"
          if [ "$UPLOAD_TO_HUB" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi

          cfg="claude-code/baseline-shared-capacity-remote"
          echo "================================================================================"
          echo "🚀 Running Baseline Evaluation: $cfg on $MATRIX_TASK (n_concurrent=1)"
          echo "================================================================================"

          python3 eval/run.py \
            --config "$cfg" \
            --task "$MATRIX_TASK" \
            --n-concurrent 1 \
            --cloud-build \
            --stream-logs \
            --heartbeat-interval 600 \
            $UPLOAD_FLAG

  agy-baseline-eval:
    name: agy baseline (${{ matrix.task }})
    needs: [detect-changed-targets]
    if: >-
      !cancelled() && needs.detect-changed-targets.result == 'success' &&
      needs.detect-changed-targets.outputs.agy_tasks != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJson(needs.detect-changed-targets.outputs.agy_tasks) }}
    concurrency:
      group: agy-baseline-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: linux-x86-agent-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    timeout-minutes: 1440
    permissions:
      contents: read
      id-token: write

    env:
      UPLOAD_TO_HUB: ${{ github.event.inputs.upload_to_hub || 'true' }}
      VERTEXAI_PROJECT: ${{ github.event.inputs.vertex_ai_project || 'tpu-nexus-767207' }}
      VERTEXAI_LOCATION: ${{ github.event.inputs.vertex_ai_location || 'global' }}
      GKE_AUTH_ACCOUNT: metadata
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          ./eval/setup.sh
          echo "$GITHUB_WORKSPACE/eval/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # No get-gke-credentials step: eval/run.py mints its own
      # single-context kubeconfig and strips the gke-gcloud-auth-plugin exec
      # block, which the eval container cannot run. A kubeconfig written here
      # would go unread.

      # GCP auth comes from the runner's GKE metadata server (Workload
      # Identity), not ADC: GKE_AUTH_ACCOUNT=metadata is set in env, and
      # run.py refuses to run if an ADC file is present.
      - name: Check GKE metadata server identity
        run: |
          email=$(curl -sf -H "Metadata-Flavor: Google" \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email) || {
            echo "::error::GKE metadata server unreachable from this job"; exit 1; }
          echo "==> [auth] GKE metadata server service account: $email"
          adc="$HOME/.config/gcloud/application_default_credentials.json"
          if [ -f "$adc" ]; then
            echo "::error::ADC found at $adc; this run must not use ADC"; exit 1
          fi
          echo "==> [auth] no ADC at $adc"

      - name: Verify Evaluation Setup (Schema & Task Check)
        run: |
          ./eval/verify.sh nightly-onboard-optimize

      - name: Run Antigravity Baseline Harbor Evaluation
        env:
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_AUTH }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_AUTH }}
          VERTEXAI_PROJECT: ${{ env.VERTEXAI_PROJECT }}
          VERTEXAI_LOCATION: ${{ env.VERTEXAI_LOCATION }}
          HARBOR_IMPERSONATE_SA: 141197224043-compute@developer.gserviceaccount.com
          GKE_IMPERSONATE_SA: harbor-ci-runner@tpu-nexus-767207.iam.gserviceaccount.com
          MATRIX_TASK: ${{ matrix.task }}
        run: |
          UPLOAD_FLAG="--no-upload"
          if [ "$UPLOAD_TO_HUB" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi

          cfg="agy/baseline-shared-capacity-remote"
          echo "================================================================================"
          echo "🚀 Running Baseline Evaluation: $cfg on $MATRIX_TASK (n_concurrent=1)"
          echo "================================================================================"

          python3 eval/run.py \
            --config "$cfg" \
            --task "$MATRIX_TASK" \
            --n-concurrent 1 \
            --cloud-build \
            --stream-logs \
            --heartbeat-interval 600 \
            $UPLOAD_FLAG
