name: Nightly Functional Evaluations
on:
  schedule:
    # Run daily at 5:00 PM PST / 6:00 PM PDT (01:00 UTC next day).
    # Runs on v6e (~1.5-2h) while daytime v7x post-merge baseline runs drain,
    # finishing before nightly-onboard-optimize starts at 04:00 UTC so Vertex AI
    # and self-hosted runner peaks do not overlap.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      config:
        description: 'Harbor Job Configuration'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'claude-code/agent-suite-remote'
          - 'agy/agent-suite-remote'
      dataset:
        description: 'Dataset to evaluate'
        required: false
        default: 'nightly-functional'
      upload_to_hub:
        description: 'Upload results to Harbor Hub'
        required: false
        type: boolean
        default: true
      tpu_cluster_name:
        description: 'GKE TPU Cluster Name'
        required: true
        default: 'tpu-nexus-cluster'
      tpu_cluster_region:
        description: 'GCP Location'
        required: true
        default: 'us-central2-b'
      tpu_cluster_project:
        description: 'GCP Project'
        required: true
        default: 'tpu-nexus-767207'
      vertex_ai_project:
        description: 'Vertex AI project for Claude Code & Anthropic models access'
        required: false
        default: 'tpu-nexus-767207'
      vertex_ai_location:
        description: 'Vertex AI location'
        required: false
        default: 'global'

  # A PR that adds or edits a task under nightly-functional/ runs just those tasks,
  # under the same configs the schedule uses. Dropping a task directory into
  # nightly-functional/ is all it takes; nothing here names individual tasks.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'eval/datasets/nightly-functional/**'

concurrency:
  group: nightly-functional-eval-${{ github.ref }}
  # A newer push to the same PR supersedes the older run; scheduled and manual
  # runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The run steps use bash (arrays, here-strings, process substitution). Without
# a `shell`, a step in a `container:` job runs under `sh`, not bash.
defaults:
  run:
    shell: bash

# checkout uses a detached merge commit for PRs; record the contributor's commit.
env:
  EVAL_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Which nightly-functional tasks this PR added or modified. Empty on schedule and
  # workflow_dispatch, where the whole dataset runs as before.
  detect-changed-tasks:
    name: detect changed nightly-functional tasks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tasks: ${{ steps.detect.outputs.tasks }}
    steps:
      - name: Checkout Repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base branch tip):
          # diffing the two is exactly what the PR changes.
          fetch-depth: 2

      - name: Detect changed tasks
        id: detect
        if: github.event_name == 'pull_request'
        run: |
          # Each task is a directory directly under nightly-functional/ holding a
          # task.toml. Deleted tasks drop out because their task.toml is gone;
          # names are held to the dataset naming rule before reaching a shell.
          root="eval/datasets/nightly-functional"
          tasks=""
          while read -r name; do
            [[ "$name" =~ ^[a-z0-9-]+$ ]] || continue
            [ -f "$root/$name/task.toml" ] || continue
            tasks="$tasks nightly-functional/$name"
          done < <(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- "$root/" \
                     | cut -d/ -f4 | sort -u)
          tasks="${tasks# }"
          echo "Changed nightly-functional tasks: ${tasks:-(none)}"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          {
            echo "### Nightly functional tasks selected by this PR"
            echo
            if [ -n "$tasks" ]; then
              for t in $tasks; do echo "- \`$t\`"; done
            else
              echo "None: no task under \`$root/\` was added or modified."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-image:
    name: build nexus-tpu image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/tpu-image.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  claude-code-nightly-eval:
    name: claude-code nightly eval
    needs: [detect-changed-tasks, build-image]
    if: >-
      !cancelled() && needs.detect-changed-tasks.result == 'success' && (
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.detect-changed-tasks.outputs.tasks != '') ||
      github.event.inputs.config == 'all' || github.event.inputs.config == 'claude-code/agent-suite-remote')
    runs-on: linux-x86-agent-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
      id-token: write

    env:
      TPU_CLUSTER_NAME: ${{ github.event.inputs.tpu_cluster_name || 'tpu-nexus-cluster' }}
      TPU_CLUSTER_REGION: ${{ github.event.inputs.tpu_cluster_region || 'us-central2-b' }}
      TPU_CLUSTER_PROJECT: ${{ github.event.inputs.tpu_cluster_project || 'tpu-nexus-767207' }}
      GKE_TPU_ACCELERATOR: tpu-v6e-slice
      GKE_TPU_TOPOLOGY: 2x4
      TASK_DOCKER: ${{ needs.build-image.outputs.image || 'us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu:latest' }}
      UPLOAD_TO_HUB: ${{ github.event.inputs.upload_to_hub || 'true' }}
      VERTEXAI_PROJECT: ${{ github.event.inputs.vertex_ai_project || 'tpu-nexus-767207' }}
      VERTEXAI_LOCATION: ${{ github.event.inputs.vertex_ai_location || 'global' }}
      # The -remote configs default to the host ADC; CI authenticates as
      # the runner's GKE metadata server instead, and run.py then keeps
      # the ADC out of the trial pod.
      GKE_AUTH_ACCOUNT: metadata
      # GCS staging for outputs over 1 MiB, such as a kernel run's profile
      # trace: a dedicated eval bucket that holds nothing else, and the TPU
      # pod's Kubernetes service account. Repository variables, empty until
      # they are set; tpu-kernel-development stops at needs_input without them.
      GKE_STAGING_BUCKET: ${{ vars.EVAL_STAGING_BUCKET }}
      GKE_POD_SERVICE_ACCOUNT: ${{ vars.EVAL_POD_SERVICE_ACCOUNT }}
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_HARBOR_KEY: ${{ secrets.HARBOR_API_KEY != '' }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          ./eval/setup.sh
          echo "$GITHUB_WORKSPACE/eval/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # No get-gke-credentials step: eval/run.py mints its own
      # single-context kubeconfig and strips the gke-gcloud-auth-plugin exec
      # block, which the eval container cannot run. A kubeconfig written here
      # would go unread.

      # GCP auth comes from the runner's GKE metadata server (Workload
      # Identity), not ADC: this job sets GKE_AUTH_ACCOUNT=metadata, and
      # run.py refuses to run if an ADC file is present.
      - name: Check GKE metadata server identity
        run: |
          email=$(curl -sf -H "Metadata-Flavor: Google" \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email) || {
            echo "::error::GKE metadata server unreachable from this job"; exit 1; }
          echo "==> [auth] GKE metadata server service account: $email"
          adc="$HOME/.config/gcloud/application_default_credentials.json"
          if [ -f "$adc" ]; then
            echo "::error::ADC found at $adc; this run must not use ADC"; exit 1
          fi
          echo "==> [auth] no ADC at $adc"

      - name: Verify Evaluation Setup (Schema & Task Check)
        run: |
          ./eval/verify.sh nightly-functional

      - name: Record task image
        env:
          BUILD_RESULT: ${{ needs.build-image.result }}
          BUILT_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          if [ -n "$BUILT_IMAGE" ]; then
            note="built by this run"
          else
            note="image build $BUILD_RESULT, no image pushed; ran on previous latest"
            echo "::warning::$note: $TASK_DOCKER"
          fi
          echo "==> task image: $TASK_DOCKER ($note)"
          printf "### Task image\n\n\`%s\` (%s)\n\n" "$TASK_DOCKER" "$note" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code Harbor Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          VERTEXAI_PROJECT: ${{ env.VERTEXAI_PROJECT }}
          VERTEXAI_LOCATION: ${{ env.VERTEXAI_LOCATION }}
          GKE_CLUSTER: ${{ env.TPU_CLUSTER_NAME }}
          GKE_LOCATION: ${{ env.TPU_CLUSTER_REGION }}
          GKE_PROJECT: ${{ env.TPU_CLUSTER_PROJECT }}
          DATASET: ${{ github.event.inputs.dataset || 'nightly-functional' }}
          PR_TASKS: ${{ needs.detect-changed-tasks.outputs.tasks }}
        run: |
          cfg="claude-code/agent-suite-remote"
          # PR_TASKS is set only on pull_request: the space-separated nightly
          # tasks the PR touched, validated by detect-changed-tasks.
          if [ -n "$PR_TASKS" ]; then
            read -r -a PR_TASK_LIST <<< "$PR_TASKS"
            SELECTION=(--task "${PR_TASK_LIST[@]}")
            TARGET="tasks $PR_TASKS"
          else
            SELECTION=(--dataset "$DATASET")
            TARGET="dataset $DATASET"
          fi
          echo "================================================================================"
          echo "🚀 Running Evaluation: $cfg on $TARGET"
          echo "================================================================================"

          UPLOAD_FLAG="--no-upload"
          if [ "$UPLOAD_TO_HUB" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi

          python3 eval/run.py \
            --config "$cfg" \
            "${SELECTION[@]}" \
            --cloud-build \
            --stream-logs \
            $UPLOAD_FLAG

  antigravity-nightly-eval:
    name: antigravity nightly eval
    needs: [detect-changed-tasks, build-image]
    if: >-
      !cancelled() && needs.detect-changed-tasks.result == 'success' && (
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.detect-changed-tasks.outputs.tasks != '') ||
      github.event.inputs.config == 'all' || github.event.inputs.config == 'agy/agent-suite-remote')
    runs-on: linux-x86-agent-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
      id-token: write

    env:
      TPU_CLUSTER_NAME: ${{ github.event.inputs.tpu_cluster_name || 'tpu-nexus-cluster' }}
      TPU_CLUSTER_REGION: ${{ github.event.inputs.tpu_cluster_region || 'us-central2-b' }}
      TPU_CLUSTER_PROJECT: ${{ github.event.inputs.tpu_cluster_project || 'tpu-nexus-767207' }}
      GKE_TPU_ACCELERATOR: tpu-v6e-slice
      GKE_TPU_TOPOLOGY: 2x4
      TASK_DOCKER: ${{ needs.build-image.outputs.image || 'us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu:latest' }}
      UPLOAD_TO_HUB: ${{ github.event.inputs.upload_to_hub || 'true' }}
      VERTEXAI_PROJECT: ${{ github.event.inputs.vertex_ai_project || 'tpu-nexus-767207' }}
      VERTEXAI_LOCATION: ${{ github.event.inputs.vertex_ai_location || 'global' }}
      # The -remote configs default to the host ADC; CI authenticates as
      # the runner's GKE metadata server instead, and run.py then keeps
      # the ADC out of the trial pod.
      GKE_AUTH_ACCOUNT: metadata
      # GCS staging for outputs over 1 MiB, such as a kernel run's profile
      # trace: a dedicated eval bucket that holds nothing else, and the TPU
      # pod's Kubernetes service account. Repository variables, empty until
      # they are set; tpu-kernel-development stops at needs_input without them.
      GKE_STAGING_BUCKET: ${{ vars.EVAL_STAGING_BUCKET }}
      GKE_POD_SERVICE_ACCOUNT: ${{ vars.EVAL_POD_SERVICE_ACCOUNT }}
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_HARBOR_KEY: ${{ secrets.HARBOR_API_KEY != '' }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          ./eval/setup.sh
          echo "$GITHUB_WORKSPACE/eval/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # No get-gke-credentials step: eval/run.py mints its own
      # single-context kubeconfig and strips the gke-gcloud-auth-plugin exec
      # block, which the eval container cannot run. A kubeconfig written here
      # would go unread.

      # GCP auth comes from the runner's GKE metadata server (Workload
      # Identity), not ADC: this job sets GKE_AUTH_ACCOUNT=metadata, and
      # run.py refuses to run if an ADC file is present.
      - name: Check GKE metadata server identity
        run: |
          email=$(curl -sf -H "Metadata-Flavor: Google" \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email) || {
            echo "::error::GKE metadata server unreachable from this job"; exit 1; }
          echo "==> [auth] GKE metadata server service account: $email"
          adc="$HOME/.config/gcloud/application_default_credentials.json"
          if [ -f "$adc" ]; then
            echo "::error::ADC found at $adc; this run must not use ADC"; exit 1
          fi
          echo "==> [auth] no ADC at $adc"

      - name: Verify Evaluation Setup (Schema & Task Check)
        run: |
          ./eval/verify.sh nightly-functional

      - name: Record task image
        env:
          BUILD_RESULT: ${{ needs.build-image.result }}
          BUILT_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          if [ -n "$BUILT_IMAGE" ]; then
            note="built by this run"
          else
            note="image build $BUILD_RESULT, no image pushed; ran on previous latest"
            echo "::warning::$note: $TASK_DOCKER"
          fi
          echo "==> task image: $TASK_DOCKER ($note)"
          printf "### Task image\n\n\`%s\` (%s)\n\n" "$TASK_DOCKER" "$note" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Antigravity Harbor Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          VERTEXAI_PROJECT: ${{ env.VERTEXAI_PROJECT }}
          VERTEXAI_LOCATION: ${{ env.VERTEXAI_LOCATION }}
          GKE_CLUSTER: ${{ env.TPU_CLUSTER_NAME }}
          GKE_LOCATION: ${{ env.TPU_CLUSTER_REGION }}
          GKE_PROJECT: ${{ env.TPU_CLUSTER_PROJECT }}
          DATASET: ${{ github.event.inputs.dataset || 'nightly-functional' }}
          PR_TASKS: ${{ needs.detect-changed-tasks.outputs.tasks }}
        run: |
          cfg="agy/agent-suite-remote"
          # See the claude-code job: PR_TASKS is the validated set of nightly
          # tasks the PR touched, empty outside pull_request.
          if [ -n "$PR_TASKS" ]; then
            read -r -a PR_TASK_LIST <<< "$PR_TASKS"
            SELECTION=(--task "${PR_TASK_LIST[@]}")
            TARGET="tasks $PR_TASKS"
          else
            SELECTION=(--dataset "$DATASET")
            TARGET="dataset $DATASET"
          fi
          echo "================================================================================"
          echo "🚀 Running Evaluation: $cfg on $TARGET"
          echo "================================================================================"

          if [ "$HAS_GEMINI_KEY" != "true" ]; then
            echo "⚠️ Skipping $cfg: GEMINI_API_KEY is not configured in repository secrets."
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              printf "### ⚠️ Skipped Evaluation: \`%s\`\n\n> GEMINI_API_KEY is not configured in repository secrets.\n\n---\n\n" "$cfg" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          UPLOAD_FLAG="--no-upload"
          if [ "$UPLOAD_TO_HUB" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi

          python3 eval/run.py \
            --config "$cfg" \
            "${SELECTION[@]}" \
            --cloud-build \
            --stream-logs \
            $UPLOAD_FLAG
