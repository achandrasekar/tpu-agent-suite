# This file defines a build workflow for the TPU workload
# image (eval/images/nexus-tpu/Dockerfile), pushed to
#   us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu:dev<datetime>
#   us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu:latest
# nightly-functional-eval.yml and nightly-onboard-optimize-eval.yml call this
# workflow (workflow_call) before their evals, so the nightly evals get a fresh
# build of the latest vLLM-TorchTPU prod base and use the pushed image by digest
# (the `image` output). When both workflows run against the same base digest and
# inputs, the second call reuses the already-pushed image by its content tag.
# Cleanup of nightly images is performed according to settings in the
# tpu-nexus artifact registry.
#
# The GCP_SA_KEY account pulls the base and pushes the result, so it needs
# Artifact Registry read access for cloud-ullm-inference-ci-cd/vllm-torchtpu
# and write access for tpu-nexus-767207/nexus-dev.
name: tpu-image
on:
  workflow_call:
    secrets:
      GCP_SA_KEY:
        required: false
    outputs:
      image:
        description: The pushed image by digest (empty if nothing was pushed).
        value: ${{ jobs.image.outputs.image }}
  workflow_dispatch:
  pull_request:
    paths:
      - 'eval/images/nexus-tpu/**'
      - 'package/requirements-tpu.txt'
      - '.github/workflows/tpu-image.yml'
  push:
    branches: [main]
    paths:
      - 'eval/images/nexus-tpu/**'
      - 'package/requirements-tpu.txt'
      - '.github/workflows/tpu-image.yml'
permissions:
  contents: read
# Publishing runs (nightly, dispatch, merge) share one "group", so two of them
# don't push at once, and an older build cannot overwrite a newer `latest`.
# Similarly, each PR gets its own "group", so a new commit cancels that PR's older run.
concurrency:
  group: tpu-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      BASE_IMAGE: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
      IMAGE_REPO: us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Skip without credentials
        if: env.HAS_KEY != 'true'
        run: echo "::notice::GCP_SA_KEY is not set; the base image is private, so nothing is built."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_KEY == 'true'
        with:
          persist-credentials: false

      - name: Free disk space
        if: env.HAS_KEY == 'true'
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/boost
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Authenticate to Google Cloud
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure docker for Artifact Registry
        if: env.HAS_KEY == 'true'
        run: |
          echo "Authenticated as: $(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")"
          gcloud auth configure-docker us-central1-docker.pkg.dev,us-docker.pkg.dev --quiet

      - name: Resolve base image and cache key
        if: env.HAS_KEY == 'true'
        id: base
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          requirements_sha="$(sha256sum package/requirements-tpu.txt | cut -d' ' -f1)"
          dockerfile_sha="$(sha256sum eval/images/nexus-tpu/Dockerfile | cut -d' ' -f1)"
          cache_key="$(printf '%s\n%s\n%s\n' "$digest" "$requirements_sha" "$dockerfile_sha" | sha256sum | cut -c1-16)"
          cache_tag="cache-${cache_key}"
          cached_digest=""
          if [ "$PUBLISH" = "true" ]; then
            cached_digest="$(gcloud artifacts docker images describe "$IMAGE_REPO:$cache_tag" \
              --format='value(image_summary.digest)' 2>/dev/null || true)"
          fi
          if [ -n "$cached_digest" ]; then
            echo "Cache hit: $IMAGE_REPO@$cached_digest ($cache_tag)"
          else
            echo "Cache miss for $cache_tag (base: $digest)"
          fi
          {
            echo "digest=$digest"
            echo "requirements_sha=$requirements_sha"
            echo "cache_tag=$cache_tag"
            echo "cached_image=${cached_digest:+$IMAGE_REPO@$cached_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: env.HAS_KEY == 'true' && steps.base.outputs.cached_image == ''
        id: build
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          tag="dev$(date -u +%Y%m%d-%H%M)"
          docker build \
            -f eval/images/nexus-tpu/Dockerfile \
            --build-arg "BASE_IMAGE=$BASE_DIGEST" \
            -t "$IMAGE_REPO:$tag" \
            package
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: env.HAS_KEY == 'true' && steps.base.outputs.cached_image == ''
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REPO:$TAG" python3 -m pip check | tee pip-check.txt || true
          if grep -v -e 'has requirement setuptools' -e '^No broken requirements found' pip-check.txt; then
            exit 1
          fi
          docker run --rm "$IMAGE_REPO:$TAG" python3 -c \
            "import torch, torch_tpu, jax, vllm, transformers; print(torch.__version__, jax.__version__)"

      - name: Push
        if: env.PUBLISH == 'true'
        id: push
        env:
          TAG: ${{ steps.build.outputs.tag }}
          CACHE_TAG: ${{ steps.base.outputs.cache_tag }}
          CACHED_IMAGE: ${{ steps.base.outputs.cached_image }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          REQUIREMENTS_SHA: ${{ steps.base.outputs.requirements_sha }}
        run: |
          set -euo pipefail
          if [ -n "$CACHED_IMAGE" ]; then
            echo "Reusing existing image: $CACHED_IMAGE"
            echo "image=$CACHED_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker push "$IMAGE_REPO:$TAG"
          docker tag "$IMAGE_REPO:$TAG" "$IMAGE_REPO:latest"
          docker push "$IMAGE_REPO:latest"
          docker tag "$IMAGE_REPO:$TAG" "$IMAGE_REPO:$CACHE_TAG"
          docker push "$IMAGE_REPO:$CACHE_TAG"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPO:$TAG")"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Nightly image \`$TAG\`"
            echo
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| Image | \`$digest\` |"
            echo "| Tags | \`$IMAGE_REPO:$TAG\`, \`$IMAGE_REPO:latest\` |"
            echo "| Base | \`$BASE_DIGEST\` |"
            echo "| requirements-tpu.txt sha256 | \`$REQUIREMENTS_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
