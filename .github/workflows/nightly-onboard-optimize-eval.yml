name: Nightly Onboard Optimize Evaluations
run-name: >-
  Nightly Onboard Optimize (${{ github.ref_name }} | ${{ inputs.config || 'all' }} | ${{ inputs.task || 'all' }})
on:
  schedule:
    # Run daily at 6:00 AM PST / 7:00 AM PDT (14:00 UTC): image build and trial
    # setup complete during ubench-regression-tests's quietest morning trough
    # (14:00-16:00 UTC), followed by the full 12-hour priority-dev peak quota
    # window (311 chips, 16:00-04:00 UTC) before the 04:00 UTC off-peak cliff.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      config:
        description: 'Harbor Job Configuration (or "all" for both configs)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'claude-code/agent-suite-shared-capacity-remote'
          - 'agy/agent-suite-shared-capacity-remote'
      task:
        description: 'Onboard/Optimize Task to evaluate (or "all" for full dataset)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'nightly-onboard-optimize/onboarding-qwen3-8-27b'
          - 'nightly-onboard-optimize/onboarding-gemma-4-31b-it'
          - 'nightly-onboard-optimize/onboarding-mistral-small-24b'
          - 'nightly-onboard-optimize/onboarding-gpt-oss-20b'
          - 'nightly-onboard-optimize/tpu-inference-gemma-4-31b-it-vllm'
          - 'nightly-onboard-optimize/tpu-inference-gpt-oss-20b-vllm'
          - 'nightly-onboard-optimize/tpu-inference-qwen3-8-27b-vllm'
      upload_to_hub:
        description: 'Upload results to Harbor Hub'
        required: false
        default: true
        type: boolean

# checkout uses a detached merge commit for PRs; record the contributor's commit.
env:
  EVAL_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  discover-tasks:
    name: discover onboard-optimize tasks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      task_list: ${{ steps.discover.outputs.task_list }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Discover tasks in LPT order
        id: discover
        env:
          TASK_INPUT: ${{ github.event.inputs.task || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          root = pathlib.Path("eval/datasets/nightly-onboard-optimize")
          task_input = os.environ.get("TASK_INPUT", "all") or "all"

          def lpt_key(task: str) -> tuple[int, str]:
              name = task.rsplit("/", 1)[-1]
              rank = 0 if name.startswith("tpu-inference-") else 1 if name.startswith("onboarding-") else 2
              return (rank, task)

          if task_input != "all":
              tasks = [task_input]
          else:
              # Longest-Processing-Time-First (LPT):
              # tpu-inference-* (onboard + optimize) first, then onboarding-* (onboarding-only), then any others.
              tasks = sorted(
                  (f"nightly-onboard-optimize/{p.parent.name}" for p in root.glob("*/task.toml")),
                  key=lpt_key,
              )

          task_json = json.dumps(tasks)
          print(f"Discovered tasks ({len(tasks)}): {task_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"task_list={task_json}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### Nightly Onboard-Optimize Task Matrix (LPT Order)\n\n")
              for idx, t in enumerate(tasks, 1):
                  fh.write(f"{idx}. `{t}`\n")
          PY

  build-image:
    name: build nexus-tpu image
    permissions:
      contents: read
    uses: ./.github/workflows/tpu-image.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  claude-code-onboard-optimize-eval:
    name: claude-code (${{ matrix.task }})
    needs: [discover-tasks, build-image]
    if: >-
      !cancelled() && needs.discover-tasks.result == 'success' &&
      needs.discover-tasks.outputs.task_list != '[]' && (
      github.event_name == 'schedule' ||
      github.event.inputs.config == 'all' ||
      github.event.inputs.config == 'claude-code/agent-suite-shared-capacity-remote')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task: ${{ fromJson(needs.discover-tasks.outputs.task_list) }}
    concurrency:
      group: cc-agent-suite-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: linux-x86-agent-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    # Each matrix job executes 1 trial (--n-concurrent 1) with its own fresh 24h runner
    # timeout once scheduled, and 18h Harbor trial timeout (6h base * 3.0 multiplier).
    timeout-minutes: 1440
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    env:
      TASK_DOCKER: ${{ needs.build-image.outputs.image || 'us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu:latest' }}
      UPLOAD_TO_HUB: ${{ github.event.inputs.upload_to_hub || 'true' }}
      GKE_AUTH_ACCOUNT: metadata
      # GCS staging for outputs over 1 MiB, such as a kernel run's profile
      # trace: a dedicated eval bucket that holds nothing else, and the TPU
      # pod's Kubernetes service account. Repository variables, empty until
      # they are set; tpu-kernel-development stops at needs_input without them.
      GKE_STAGING_BUCKET: ${{ vars.EVAL_STAGING_BUCKET }}
      GKE_POD_SERVICE_ACCOUNT: ${{ vars.EVAL_POD_SERVICE_ACCOUNT }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          ./eval/setup.sh
          echo "$GITHUB_WORKSPACE/eval/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # No get-gke-credentials step: eval/run.py mints its own
      # single-context kubeconfig and strips the gke-gcloud-auth-plugin exec
      # block, which the eval container cannot run. A kubeconfig written here
      # would go unread.

      # GCP auth comes from the runner's GKE metadata server (Workload
      # Identity), not ADC: GKE_AUTH_ACCOUNT=metadata is set in env, and
      # run.py refuses to run if an ADC file is present.
      - name: Check GKE metadata server identity
        run: |
          email=$(curl -sf -H "Metadata-Flavor: Google" \
            http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email) || {
            echo "::error::GKE metadata server unreachable from this job"; exit 1; }
          echo "==> [auth] GKE metadata server service account: $email"
          adc="$HOME/.config/gcloud/application_default_credentials.json"
          if [ -f "$adc" ]; then
            echo "::error::ADC found at $adc; this run must not use ADC"; exit 1
          fi
          echo "==> [auth] no ADC at $adc"

      - name: Verify Evaluation Setup (Schema & Task Check)
        run: |
          ./eval/verify.sh nightly-onboard-optimize

      - name: Record task image
        env:
          BUILD_RESULT: ${{ needs.build-image.result }}
          BUILT_IMAGE: ${{ needs.build-image.outputs.image }}
        run: |
          if [ -n "$BUILT_IMAGE" ]; then
            note="built by this run"
          else
            note="image build $BUILD_RESULT, no image pushed; ran on previous latest"
            echo "::warning::$note: $TASK_DOCKER"
          fi
          echo "==> task image: $TASK_DOCKER ($note)"
          printf "### Task image\n\n\`%s\` (%s)\n\n" "$TASK_DOCKER" "$note" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code Onboard Optimize Harbor Evaluation
        env:
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_AUTH }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_AUTH }}
          HARBOR_IMPERSONATE_SA: 141197224043-compute@developer.gserviceaccount.com
          GKE_IMPERSONATE_SA: harbor-ci-runner@tpu-nexus-767207.iam.gserviceaccount.com
          MATRIX_TASK: ${{ matrix.task }}
        run: |
          UPLOAD_FLAG="--no-upload"
          if [ "$UPLOAD_TO_HUB" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi

          cfg="claude-code/agent-suite-shared-capacity-remote"
          echo "================================================================================"
          echo "🚀 Running Claude Code Evaluation: $cfg on $MATRIX_TASK (n_concurrent=1)"
          echo "================================================================================"
          python3 eval/run.py \
            --config "$cfg" \
            --task "$MATRIX_TASK" \
            --n-concurrent 1 \
            --cloud-build \
            --stream-logs \
            --heartbeat-interval 600 \
            $UPLOAD_FLAG

  antigravity-onboard-optimize-eval:
    name: antigravity (${{ matrix.task }})
    needs: [discover-tasks, build-image]
    if: >-
      !cancelled() && needs.discover-tasks.result == 'success' &&
      needs.discover-tasks.outputs.task_list != '[]' && (
      github.event_name == 'schedule' ||
      github.event.inputs.config == 'all' ||
      github.event.inputs.config == 'agy/agent-suite-shared-capacity-remote')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task: ${{ fromJson(needs.discover-tasks.outputs.task_list) }}
    concurrency:
      group: agy-agent-suite-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: linux-x86-agent-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest # zizmor: ignore[unpinned-images]
    # Each matrix job executes 1 trial (--n-concurrent 1) with its own fresh 24h runner
    # timeout once scheduled, and 18h Harbor trial timeout (6h base * 3.0 multiplier).
    timeout-minutes: 1440
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    env:
      TASK_DOCKER: ${{ needs.build-image.outputs.image || 'us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-tpu:latest' }}
      UPLOAD_TO_HUB: ${{ github.event.inputs.upload_to_hub || 'true' }}
      GKE_AUTH_ACCOUNT: metadata
      # GCS staging for outputs over 1 MiB, such as a kernel run's profile
      # trace: a dedicated eval bucket that holds nothing else, and the TPU
      # pod's Kubernetes service account. Repository variables, empty until
      # they are set; tpu-kernel-development stops at needs_input without them.
      GKE_STAGING_BUCKET: ${{ vars.EVAL_STAGING_BUCKET }}
      GKE_POD_SERVICE_ACCOUNT: ${{ vars.EVAL_POD_SERVICE_ACCOUNT }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          ./eval/setup.sh
          echo "$GITHUB_WORKSPACE/eval/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # No get-gke-credentials step: eval/run.py mints its own
      # single-context kubeconfig and strips the gke-gcloud-auth-plugin exec
      # block, which the eval container cannot run. A kubeconfig written here
      # would go unread.

      # GCP auth comes from the runner's GKE metadata server (Workload
      # Identity), not ADC: GKE_AUTH_ACCOUNT=metadata is set in env, and
      # run.py refuses to run if an ADC file is present.
      - name: Check GKE metadata server identity
        run: |
          email=$(curl -sf -H "Metadata-Flavor: Google" \
