# This file defines a build workflow for the host-side eval image
# (eval/images/nexus-host/Dockerfile), pushed to
#   us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-host:dev<datetime>
#   us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-host:latest
# Eval tasks pin it by digest.
name: host-image
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'eval/images/nexus-host/**'
      - 'package/requirements-client.txt'
      - '.github/workflows/host-image.yml'
  push:
    branches: [main]
    paths:
      - 'eval/images/nexus-host/**'
      - 'package/requirements-client.txt'
      - '.github/workflows/host-image.yml'
permissions:
  contents: read
concurrency:
  group: host-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      BASE_IMAGE: python:3.12-slim
      IMAGE_REPO: us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-host
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve base image
        id: base
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          echo "Base: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          tag="dev$(date -u +%Y%m%d-%H%M)"
          requirements_sha="$(sha256sum package/requirements-client.txt | cut -d' ' -f1)"
          docker build \
            -f eval/images/nexus-host/Dockerfile \
            --build-arg "BASE_IMAGE=$BASE_DIGEST" \
            -t "$IMAGE_REPO:$tag" \
            package
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "requirements_sha=$requirements_sha" >> "$GITHUB_OUTPUT"

      - name: Verify
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REPO:$TAG" python3 -m pip check
          docker run --rm "$IMAGE_REPO:$TAG" sh -c \
            "kubectl version --client && gcloud --version && gke-gcloud-auth-plugin --version && jq --version && git --version && node --version && yarn --version && unzip -v >/dev/null && rewardkit --help >/dev/null && xprofiler --help >/dev/null && test -s /etc/nexus-host/constraints.txt"
          docker run --rm "$IMAGE_REPO:$TAG" python3 -c \
            "import docstring_parser, google.cloud.aiplatform, google.cloud.bigquery, google.cloud.storage, huggingface_hub, pydantic, yaml, tpu_info, vertexai, xprof"

      - name: Authenticate to Google Cloud
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Push
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          REQUIREMENTS_SHA: ${{ steps.build.outputs.requirements_sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-docker.pkg.dev --quiet
          docker push "$IMAGE_REPO:$TAG"
          docker tag "$IMAGE_REPO:$TAG" "$IMAGE_REPO:latest"
          docker push "$IMAGE_REPO:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPO:$TAG")"
          {
            echo "## Host image \`$TAG\`"
            echo
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| Image | \`$digest\` |"
            echo "| Tags | \`$IMAGE_REPO:$TAG\`, \`$IMAGE_REPO:latest\` |"
            echo "| Base | \`$BASE_DIGEST\` |"
            echo "| requirements-client.txt sha256 | \`$REQUIREMENTS_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
