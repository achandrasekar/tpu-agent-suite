schema_version = "1.4"

[task]
name = "torchtpu/onboarding-gpt-oss-20b"

[environment]
# No docker_image: environment/Dockerfile is the image. Harbor's GKE path
# never reads this key (run.py:286) -- it builds from environment/ and
# resolves the pod image by content hash -- so a pin here would name
# something nothing pulls.
storage_mb = 10240
env = { HF_MODEL_URL = "https://huggingface.co/openai/gpt-oss-20b" }

[agent]
# Long, and deliberately so: the deliverable is a vLLM server actually serving
# a 32B model on a v7 slice, reached through a queue, plus benchmarks and a
# commit history. The hf-onboarding tasks allow two hours for analysis alone.
timeout_sec = 28800.0

[verifier]
timeout_sec = 300.0
env = { HF_MODEL_URL = "https://huggingface.co/openai/gpt-oss-20b" }
