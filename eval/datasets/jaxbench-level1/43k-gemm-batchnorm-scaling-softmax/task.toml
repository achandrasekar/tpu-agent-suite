schema_version = "1.4"

artifacts = [
  { source = "/workspace/base.py", destination = "base.py" },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "jaxbench-level1/43k-gemm-batchnorm-scaling-softmax"
version = "1.0.0"
description = "Optimize 43k_gemm_batchnorm_scaling_softmax kernel for Cloud TPU v6e using Pallas/XLA"
authors = [{ name = "TorchTPU Team" }]
keywords = ["jax", "pallas", "tpu", "v6e", "optimization"]

[environment]
os = "linux"
cpus = 8
memory_mb = 65536
storage_mb = 20480
build_timeout_sec = 3600.0

[agent]
timeout_sec = 14400.0
setup_timeout_sec = 1800.0


[metadata]
category = "pallas_kernel"
difficulty = "level1"
task_id = "43k-gemm-batchnorm-scaling-softmax"
atol = 0.01
rtol = 0.01
