schema_version = "1.4"

artifacts = [
  { source = "/workspace/base.py", destination = "base.py" },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "kernel-set1/8p-gemm"
version = "1.0.0"
description = "Optimize 8p_gemm kernel for Cloud TPU v6e using Pallas/XLA"
authors = [{ name = "TorchTPU Team" }]
keywords = ["jax", "pallas", "tpu", "v6e", "optimization"]

[environment]
os = "linux"
cpus = 2
memory_mb = 65536
storage_mb = 10240

# Pinned so nothing is built; the Dockerfile beside it only satisfies
# _validate_definition, which runs before the pin is read.
docker_image = "us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-host@sha256:7ff58a98ae2655dbcf25fa0aeb3e8081281bfb3061f97581a98951e98371fff4"

[agent]
timeout_sec = 14400.0
setup_timeout_sec = 1800.0


[metadata]
category = "pallas_kernel"
difficulty = "level1"
task_id = "8p-gemm"
atol = 0.01
rtol = 0.01
