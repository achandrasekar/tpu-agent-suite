[judge]
judge = "vertex_ai/gemini-3.5-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "Profiles the TPU hardware on the remote GKE cluster rather than the local agent container."
type = "binary"
weight = 1.0

[[criterion]]
description = "Reports the TPU hardware profile returned by the cluster."
type = "binary"
weight = 1.0

[[criterion]]
description = "Routes the request from tpu-agent to tpu-model-onboarding to run the remote execution."
type = "binary"
weight = 1.0


[scoring]
aggregation = "weighted_mean"
