[judge]
judge = "vertex_ai/gemini-3.5-flash"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
description = "Verifies that tpu-agent routed/delegated the benchmarking task to tpu-model-onboarding. The judge must cite the exact turn number (e.g. Step ID) where tpu-agent invoked or delegated to tpu-model-onboarding."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that the subagent (tpu-model-onboarding) completed its work and successfully passed an execution report back to tpu-agent without stop-hook schema rejection, contract errors, or unhandled failures. The judge must cite the exact turn number (Step ID) where the subagent returned its output and verify that tpu-agent received it."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that the benchmark workflow executed successfully on Cloud TPU (not a failed run, crash, or mock/stub). The run must produce valid benchmark metrics (such as throughput, latency, duration, or speedup) for HuggingFaceTB/SmolLM2-135M-Instruct. The judge must cite the exact turn number (Step ID) where the benchmark completed and report the measured results (e.g., duration/latency/throughput numbers) in its reasoning."
type = "binary"
weight = 1.0

[[criterion]]
description = "Verifies that tpu-agent (the top-level agent) delivered a comprehensive final report to the user in the concluding turn of the conversation, summarizing the benchmark results, metrics, and artifact locations (rather than timing out, crashing, or ending on subagent output without a top-level report). The judge must cite the exact turn number (Step ID) of tpu-agent's final report to the user."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
