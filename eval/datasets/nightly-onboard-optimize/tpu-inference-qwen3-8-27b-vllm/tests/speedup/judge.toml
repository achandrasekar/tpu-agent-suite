# Reported only (weight 0 in ../reward.toml): the speedup of the optimized
# vLLM server (custom Pallas kernel) over the baseline vLLM server, on the
# bottleneck ISL/OSL regime. The judge's ratio (for
# example 1.27) is in the `raw` field of tpu_speedup in
# /logs/verifier/reward-details.json; test.sh writes it over `speedup` in
# /logs/verifier/reward.json, replacing rewardkit's 0-1 value (the ratio
# divided by 10), so `speedup` there is the ratio itself (1.0 = baseline).

[judge]
judge = "vertex_ai/gemini-3.8-flash"
reasoning_effort = "high"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
name = "tpu_speedup"
type = "numeric"
min = 0.0
max = 10.0
weight = 1.0
description = "The speedup of the optimized Qwen/Qwen3.8-27B over the baseline Qwen/Qwen3.8-27B, both served with vLLM on TPU and benchmarked with the same serving benchmark suite (same harness, concurrency levels and prompt settings): on the bottleneck regime -- the ISL/OSL combination (1k/1k or 8k/1k) the agent targeted with its custom Pallas kernel -- the output tokens per second of the optimized server (with the tuned kernel running inside the vLLM serving process) divided by the baseline's at the same concurrency, taking the concurrency at which the baseline peaked. Compare matched points, not peak to peak: peaks at different concurrencies measure the operating point as much as the kernel. Also report the ratio at every (ISL/OSL, concurrency) point both runs measured, and name any point that came back slower. If the agent named no bottleneck regime, use the regime with the largest ratio and say so. Score with that ratio as a decimal (e.g. 1.12). Score 1.0 if a baseline was measured but no optimized server was measured or none beat it, and 0 if no baseline throughput was measured with vLLM. Use only numbers that appear in tool output, not estimates or numbers only written in the agent's report. Quote the regime, the concurrency compared, and the baseline and optimized numbers at that concurrency, with their Step IDs."

[scoring]
aggregation = "weighted_mean"
