# Scoring framework, success half 2 of 2 (0.3 of the final score): the
# optimized vLLM server (custom Pallas kernel) serves at least 10% more
# output tokens per second than the baseline on the bottleneck regime. It requires onboarding_success: a model that was
# never onboarded and served on TPU cannot be hill-climbed, so this is 0 then
# (test.sh also zeroes it whenever onboarding_success is 0).

[judge]
judge = "vertex_ai/gemini-3.8-flash"
reasoning_effort = "high"
atif-trajectory = "/logs/agent/trajectory.json"
timeout = 600

[[criterion]]
name = "throughput_gain_10pct"
type = "binary"
weight = 1.0
description = "Requires a successful onboarding: if google/gemma-4-31B-it was never served with vLLM on TPU and benchmarked as a baseline (shown in tool output), this criterion fails, whatever throughput numbers the run reports, since a model that was not onboarded cannot be hill-climbed. Given that onboarding, the run reached at least a 10% output-throughput gain on the bottleneck regime: the optimized vLLM server for google/gemma-4-31B-it, with the agent's tuned custom Pallas kernel executing inside the vLLM serving process, re-ran the complete serving benchmark suite on both ISL/OSL combinations (1k/1k, 8k/1k) under the same harness, concurrency levels and prompt settings as the baseline, on the same TPU type and chip count; on the bottleneck regime (the ISL/OSL combination the kernel targets) its output tokens per second is at least 1.10 times the baseline's at the same concurrency -- compare the two runs point by point, not peak to peak, since peaks at different concurrencies measure the operating point as much as the kernel; and no (ISL/OSL, concurrency) point the baseline measured came back slower than the baseline in the optimized run, beyond run-to-run noise the agent quantifies, with the other regime also running with zero request failures. Both numbers must be measured, not estimated or projected, and appear in tool output in the trajectory. Gains from generic compiler or runtime flags alone (torch.compile, torch.inference_mode(), XLA_USE_BF16=1, TF_NUM_INTRAOP_THREADS), from changing the benchmark, or from adding chips do not count. Cite the Step IDs and quote the regime, the concurrency compared, and the baseline and optimized throughput at it."

[scoring]
aggregation = "weighted_mean"
