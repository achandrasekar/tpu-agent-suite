[judge]
judge = "vertex_ai/gemini-3.5-flash"
atif-trajectory = "/logs/agent/trajectory.json"

[[criterion]]
description = "The agent asks the user which Hub repository was meant, suggesting a meta-llama repository matching Llama 3 8B as the default and linking its huggingface.co page."
type = "binary"
weight = 1.0

[[criterion]]
description = "The question says what else the name could mean (for example Llama 3 versus 3.1, or base versus instruct) rather than naming one repository alone."
type = "binary"
weight = 1.0

[[criterion]]
description = "The reply does not claim onboarding has started and does not present one repository as already chosen without the user's confirmation."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
