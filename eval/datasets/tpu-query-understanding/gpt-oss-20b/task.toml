# The prompt that motivated query understanding, verbatim. Scored on the
# first turn only: a run passes when it follows the reference, asks
# tpu-knowledge-base what constrains the model, and stops to ask the user -- without
# delegating to tpu-model-onboarding. What happens after the user answers is
# onboarding's own eval, not this one.
schema_version = "1.4"

[task]
name = "torchtpu/tpu-query-understanding-gpt-oss-20b"
version = "1.0.0"
description = "Loosely named Hub model (\"gpt oss 20b\") with a user constraint against torch_xla. The agent must plan before acting: confirm the Hub id with the user, state what tpu-knowledge-base says constrains the model, and stop with questions instead of delegating to tpu-model-onboarding."
authors = [{ name = "TorchTPU Team" }]
keywords = ["query-understanding", "tpu-agent", "planning", "gke"]

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
# Harbor defaults to /app regardless of the image's WORKDIR, and the evaluation
# package is installed at /workspace.
workdir = "/workspace"
# Same pinned base as tpu-hello-world, which carries the package's host
# requirements. The planning turn itself touches no cluster.
docker_image = "us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/nexus-host@sha256:7ff58a98ae2655dbcf25fa0aeb3e8081281bfb3061f97581a98951e98371fff4"

[agent]
# The planning turn is minutes: it reads, asks tpu-knowledge-base, and stops to ask
# the user. It waits on no chip.
timeout_sec = 1200.0
network_mode = "public"

[verifier]
timeout_sec = 600.0
# The judge runs on Vertex. Left to itself it takes the ambient credential and
# project -- on a GCE VM, the instance's service account and project, which
# need not have Vertex access -- and a judge that cannot run scores the whole
# task 0, checks included. Use the credential ClaudeCode uploads and the
# eval's Vertex project (the default in eval/agents/claude_code.py).
# Literal on purpose: a `${VAR}` here makes `harbor run` stop and ask before
# reading the host environment, which hangs an unattended run.
env = { VERTEXAI_PROJECT = "tpu-nexus-767207", VERTEXAI_LOCATION = "global", GOOGLE_APPLICATION_CREDENTIALS = "/root/.config/gcloud/application_default_credentials.json" }

[metadata]
category = "evaluation"
