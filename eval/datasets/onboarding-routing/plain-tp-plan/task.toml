version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/plain-tp-plan"
description = "I am onboarding Qwen/Qwen3.8-27B for vLLM serving with tpu-model-onboarding, on a v6e-8 (8 devices, 32 GB HBM each). The vllm-engine-compatibility check already ran, and its outputs are in /workspace/inference: tp_plan.json and vllm_flags.txt. This session has no TPU and no compute backend, so do not run or submit any compute job. Do only Task 1 of the onboarding inference coder: write /workspace/inference/deployments.json from those files, and summarize the deployment for me in /logs/artifacts/answer.json with keys `answer` and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
