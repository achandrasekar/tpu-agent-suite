version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "onboarding-routing/verify-and-bench-0p6b"
description = "Onboard Qwen/Qwen3-0.6B (https://huggingface.co/Qwen/Qwen3-0.6B) to run as a vLLM inference server on Cloud TPU with the torch_tpu backend. Verify it answers a completion request, then give me one serving benchmark measurement at input length 1024, output length 128, concurrency 1. I do not need the server afterwards: this is verification only, so tear it down when you are done. Use the TPU slice your environment is configured for, and prefix every job name with yuran-test-. Put your summary, with the benchmark numbers, in /logs/artifacts/answer.json with keys `answer` and `reference`."

[metadata]
category = "onboarding-routing"

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
