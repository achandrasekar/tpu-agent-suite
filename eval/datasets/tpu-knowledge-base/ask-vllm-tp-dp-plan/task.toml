version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "tpu-knowledge-base/ask-vllm-tp-dp-plan"
description = "Answer this question about `vllm-tp-dp-plan`, grounded in the TPU documentation, passing it exactly as written: \"tpu-model-onboarding planned TP 8 x DP 1 for Qwen3.8-27B with vLLM on an 8-device v6e. How does it choose TP and DP, why the largest fitting TP rather than a smaller TP with more replicas, and is there a known risk with TP 8 for this model?\" Answer clearly, citing any references you can for grounding. Drop a JSON at `/logs/artifacts/answer.json` with keys `answer` and `reference`, for scoring."

[metadata]
category = "tpu-knowledge-base"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
