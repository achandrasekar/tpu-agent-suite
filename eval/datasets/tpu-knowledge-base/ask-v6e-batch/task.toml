version = "1.0"

artifacts = [
  { source = "/workspace", destination = 'workspace' },
  { source = "/root/.tpu-agent-suite/runs", destination = "tpu_agent_suite_runs" },
]

[task]
name = "tpu-knowledge-base/ask-v6e-batch"
description = "Answer these questions about the keyword `tpu-v6e-spec` in one call, passing each question exactly as written: \"What is the peak bf16 compute per chip of TPU v6e?\" \"How many TensorCores does each TPU v6e chip have?\" \"What is the clock frequency of a TPU v6e chip?\" Answer clearly, citing any references you can for grounding. Drop a JSON at `/logs/artifacts/answer.json` with keys `answer` and `reference`, for scoring."

[metadata]
category = "tpu-knowledge-base"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
