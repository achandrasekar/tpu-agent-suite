version = "1.0"

[task]
name = "tpu-knowledge-base/ask-tpu7x-power"
description = "Answer this question about `tpu7x`, grounded in the TPU documentation, passing it exactly as written: \"What is the power draw (TDP) of one TPU7x chip, in watts?\" Answer clearly, citing any references you can for grounding. Drop a JSON at `/logs/artifacts/answer.json` with keys `answer` and `reference`, for scoring."

[metadata]
category = "tpu-knowledge-base"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[environment]
workdir = "/workspace"
cpus = 2
memory_mb = 8192
storage_mb = 10240
