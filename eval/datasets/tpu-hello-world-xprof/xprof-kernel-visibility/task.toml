schema_version = "1.4"

[task]
name = "torchtpu/xprof-kernel-visibility"
version = "1.0.0"
description = "Ask whether an XProf profile carries kernel-level (LLO / custom-call) data and, when it does not, what a re-capture needs. Rewards the honest answer: the profile baked into the image was captured without the LLO flags, so the tools report the data as absent."
authors = [{ name = "TorchTPU Team" }]
keywords = ["xprof", "profiling", "llo", "pallas", "custom-call", "routing", "torchtpu"]

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/workspace"

[agent]
timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 60.0

[metadata]
category = "evaluation"
