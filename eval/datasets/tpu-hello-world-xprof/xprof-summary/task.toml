schema_version = "1.4"

[task]
name = "torchtpu/xprof-summary"
version = "1.0.0"
description = "Summarise one XProf profile: device, step time, what bounds it, and the top op. Every graded row is what the xprof CLI reports for the profile baked into the image; the instruction names tpu-agent and tpu-diagnostics conditionally so the same prompt serves both A/B arms."
authors = [{ name = "TorchTPU Team" }]
keywords = ["xprof", "profiling", "routing", "torchtpu"]

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/workspace"

[agent]
timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 60.0

[metadata]
category = "evaluation"
