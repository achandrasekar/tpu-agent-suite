schema_version = "1.4"

[task]
name = "torchtpu/xprof-hbm"
version = "1.0.0"
description = "Break down HBM for one XProf profile: capacity, peak use, what holds it, and whether the workload is HBM-bound. Graded against the xprof memory tools' own output for the profile baked into the image."
authors = [{ name = "TorchTPU Team" }]
keywords = ["xprof", "profiling", "hbm", "memory", "routing", "torchtpu"]

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/workspace"

[agent]
timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 60.0

[metadata]
category = "evaluation"
