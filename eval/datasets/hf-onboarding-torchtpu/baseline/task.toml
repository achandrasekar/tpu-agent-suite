schema_version = "1.4"

[task]
name = "torchtpu/hf-onboarding"

[environment]
# TODO(naming): image tag still reads 'hfmigrate'. Re-tag and push before renaming this string;
# editing it here does not re-tag the image and every run then fails at pull time.
docker_image = "us-docker.pkg.dev/tpu-nexus-767207/nexus-dev/torchtpu-agent:mrasquinha-hfmigrate-20260914"
env = { HF_MODEL_URL = "https://huggingface.co/Qwen/Qwen3-0.6B" }

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 120.0
env = { HF_MODEL_URL = "https://huggingface.co/Qwen/Qwen3-0.6B" }
