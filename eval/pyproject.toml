[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tpu-agent-suite-eval"
dynamic = ["version"]
description = "Evaluation tooling for TPU agents using the Harbor framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The kubernetes client's `gcp` auth provider, which refreshes the
    # token in the kubeconfig run.py writes for Harbor's GKE cluster.
    "google-auth>=2.0.0",
    "harbor[gke]==0.23.0",
    "kubernetes==36.0.3",
    "pyyaml>=6.0.2",
    "tpu-info>=0.7.1",
]

[tool.setuptools]
packages = ["agents"]
