# CSAT018 from the "TPU Knowledge Q&A" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat018
    prompt: |-
      I am profiling one of the large transformer projection matmuls on TPU v6e.

      The original local matmul on each chip is:

      [16384, 1024] x [1024, 4096]

      MXU use is about 42%.

      I tried three experiments.

      Experiment 1:

      [32768, 1024] x [1024, 4096]

      MXU use stayed around 43%.

      Experiment 2:

      [16384, 2048] x [2048, 4096]

      MXU use increased to 61%.

      Experiment 3:

      [16384, 1024] x [1024, 8192]

      MXU use stayed around 44%.

      All dimensions are multiples of 256. HBM bandwidth stayed below 40% in all four runs.

      Why did changing K help so much when increasing M or N did almost nothing?

      What does that tell me about the limiting part of this matmul on v6e, and what should I check before deciding that the fix is simply to make K larger?
    timeout_sec: 900.0
    metadata:
      uid: CSAT018
      category: TPU Knowledge Q&A
      sub_category: Roofline and performance modelling.
      difficulty: Moderate
      has_code: 'Yes'
      baseline_result: Stumped
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        A strong answer should recognize that the experiments isolate K as the dimension associated with the utilization change, but they do not prove the cause. It should not conclude that K=1024 is too small or that VMEM is the bottleneck from the given data. It should ask for the op-level roofline, VMEM bandwidth or stall data, compiled matmul tiling, layout, and MXU scheduling before deciding why larger K helped. It should also point out that simply increasing K adds more FLOPs and is not automatically an optimization.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The model correctly noticed that performance is sensitive to K, but it incorrectly concluded that the matmul is VMEM bandwidth bound. The prompt does not provide VMEM bandwidth, stall data, compiled tiling or an op-level roofline result. The model used a generic matmul arithmetic intensity calculation as proof of actual VMEM traffic and then claimed that K=1024 causes the MXU to starve. The experiment only shows that increasing K improves utilization. It does not establish why.
      weight: 0.5
