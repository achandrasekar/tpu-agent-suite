# CSAT140 from the "TPU Knowledge Q&A" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat140
    prompt: |-
      Need a number confirmed for tonight's serving sheet. v5e-16, bf16, dense 3
      billion parameter model, so 6GB of weights. We are sizing steady state
      decode, 512 concurrent sequences, one token per sequence per step, short
      contexts so the KV traffic is small next to the weights. My teammate has
      run the numbers and says a v5e chip needs about 240 tokens before a matmul
      stops being memory bound, we are at 512, so we are past that and comfortably
      compute bound, and he has 65 percent MFU going in the sheet as the planning
      figure. Confirm the 65 percent or correct it, and give me the one number to
      put in the sheet.
    timeout_sec: 900.0
    metadata:
      uid: CSAT140
      category: TPU Knowledge Q&A
      sub_category: Inference concerns.
      difficulty: Hard
      has_code: 'No'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        A good answer should not give one number because the prompt never says how the model is split across the 16 chips, and the result changes depending on that. It should first explain the threshold: 197 TFLOPs of bf16 compute divided by about 820 GB/s of HBM bandwidth gives about 240 FLOPs per byte, which is roughly 240 tokens per chip for bf16 weights. Then it should show both cases. With tensor or model parallelism, each chip holds one sixteenth of the weights and serves all 512 tokens, so the intensity per chip is 512, which is above the threshold, making a compute bound result reasonable. With data parallelism, each chip holds the full 6 GB model and serves only 32 tokens, which is far below the threshold. That makes it memory bound by about seven times and limits it to around 13 percent of peak, so 65 percent would not be possible. The correct next step is to ask how the model is sharded before putting a number in the sheet. Mentioning that hybrid sharding would fall somewhere between these two cases also strengthens the answer.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The math is correct throughout. The ridge point is 240.5 from 197e12 divided by 819e9, the intensity is the number of tokens per chip, 32 compared with 240 gives 13.3 percent, the step time is 7.33 ms, and it correctly notes that 65 percent would require about five times the available bandwidth. The problem is that it misses the main point being tested. The prompt never says how the model is sharded, and the answer changes depending on that. The model assumes production serving uses data parallelism with 16 replicas and gives one final number. But with tensor parallelism, each chip reads only one sixteenth of the weights while serving all 512 tokens, giving a per chip intensity of 512. In that case, the teammate's compute bound conclusion is reasonable. The answer never mentions this possibility or asks how the model is sharded. It also incorrectly mentions an AI Studio environment snapshot Download button that does not exist.
      weight: 0.5
