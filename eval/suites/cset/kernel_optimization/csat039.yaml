# CSAT039 from the "Kernel optimization" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat039
    prompt: |-
      I'm tuning Kimi K2's expert selection on TPU7x and need a faster Pallas implementation of the computation below. router_scores has shape (4096,384) and correction_bias has shape (384,), both float32. Preserve the function signature, input layouts, and output ordering, matching the reference with rtol=1e-5 and atol=1e-6.
      import jax
      import jax.numpy as jnp
      def get_inputs():
      k1, k2 = jax.random.split(jax.random.key(42))
      router_logits = jax.nn.sigmoid(jax.random.normal(k1,(4096,384), dtype=jnp.float32))
      correction_bias = 0.05 * jax.random.normal(k2,(384,), dtype=jnp.float32)
      dynamic_args = [router_logits, correction_bias]
      static_args = []
      return dynamic_args, static_args
      def computation(router_logits,correction_bias):
      num_expert_group = 1
      topk_group = 1
      topk = 8
      num_token = router_logits.shape[0]
      scores_for_choice = router_logits.reshape(num_token, -1) + jnp.expand_dims(
      correction_bias, axis=0
      )
      Group scores calculation
      scores_grouped = scores_for_choice.reshape(num_token, num_expert_group, -1)
      group_scores = jnp.sum(jax.lax.top_k(scores_grouped, k=2)[0], axis=-1)  # [n, n_group]
      Get top group indices [n, top_k_group]
      group_idx = jax.lax.top_k(group_scores, k=topk_group)[1]
      Create group mask using scatter [n, n_group]
      group_mask = jnp.clip(jax.nn.one_hot(group_idx, num_expert_group).sum(axis=1), 0, 1)
      Create score mask
      experts_per_group = router_logits.shape[-1] // num_expert_group
      score_mask = jnp.expand_dims(group_mask, axis=-1)  # [n, n_group, 1]
      score_mask = jnp.broadcast_to(
      score_mask, (num_token, num_expert_group, experts_per_group)
      )
      score_mask = score_mask.reshape(num_token, -1)  # [n, e]
      Apply mask and get topk
      tmp_scores = jnp.where(score_mask, scores_for_choice, float("-inf"))  # [n, e]
      topk_ids = jax.lax.top_k(tmp_scores, k=topk)[1]
      topk_weights = jnp.take_along_axis(router_logits, topk_ids, axis=1)
      return topk_weights, topk_ids
    timeout_sec: 900.0
    metadata:
      uid: CSAT039
      category: Kernel optimization
      sub_category: Reductions and normalisation
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Stumped
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        The expected TPU7x Pallas implementation preserves both runtime FP32 inputs and their layouts, simplifies the single group case, and fuses bias addition, exact top-8 selection across all 384 experts, and retrieval of the original unbiased weights using supported on-chip operations. It retains the function signature and reference ranking and tie-breaking, returning weights followed by expert IDs as FP32 and INT32 arrays, respectively, both shaped (4096,8). It uses valid tiles and a weight selection strategy compatible with Mosaic’s gather restrictions, compiles and executes on TPU7x, matches IDs exactly and weights at rtol=1e-5, atol=1e-6, and demonstrates a meaningful latency improvement over the compiled JAX reference.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The proposed kernel fails during Mosaic compilation on TPU7x. In _expert_selection_kernel, jnp.take_along_axis(x,topk_ids,axis=-1) lowers through _gather_lowering_rule to tpu.dynamic_gather. The 384-element expert axis of the (128,384) source tile spans three 128-lane vector register segments, while this lowering supports only one source register along the gather dimension. Mosaic’s vector layout pass therefore rejects it with “Not implemented: Multiple source vregs along gather dimension.”
        The proposed kernel therefore fails before execution, leaving the optimization task unsolved and preventing correctness and speedup checks.
      weight: 0.5
