# CSAT030 from the "GPU Kernel to PyTorch API conversion" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat030
    prompt: |-
      Convert the following code to PyTorch code so that it can be compiled by OpenXLA and run on TPUs:

      import torch
      import triton
      import triton.language as tl

      @triton.jit
      def complex_fused_blocked_matmul_kernel(
          # Pointers
          a_ptr, b_ptr, scale_b_ptr, lut_ptr, out_ptr,
          # Dimensions & Strides
          stride_am, stride_ak,
          stride_bk, stride_bn,
          stride_out_m, stride_out_n,
          total_active_blocks,
          K, N_HALF,
          # Meta-parameters
          BLOCK_M: tl.constexpr,
          BLOCK_N: tl.constexpr,
          BLOCK_K: tl.constexpr,
      ):
          # 1. Indirect block indexing via 1D dispatch
          pid = tl.program_id(0)
          if pid >= total_active_blocks:
              return

          # Read tile spatial coordinates from LUT: [tile_m_idx, tile_n_idx]
          tile_m = tl.load(lut_ptr + pid * 2)
          tile_n = tl.load(lut_ptr + pid * 2 + 1)

          # 2. Offset setup
          offs_m = tile_m * BLOCK_M + tl.arange(0, BLOCK_M)
          offs_n = tile_n * BLOCK_N + tl.arange(0, BLOCK_N)
          offs_k = tl.arange(0, BLOCK_K)

          # Dual accumulator registers for fused GLU (gate and value projections)
          acc_gate = tl.zeros((BLOCK_M, BLOCK_N), dtype=tl.float32)
          acc_val = tl.zeros((BLOCK_M, BLOCK_N), dtype=tl.float32)

          # Pointers to A and B
          a_ptrs = a_ptr + (offs_m[:, None] * stride_am + offs_k[None, :] * stride_ak)

          # B is packed as [K, 2 * N_HALF] -> gate sits in first half, value in second half
          b_gate_ptrs = b_ptr + (offs_k[:, None] * stride_bk + offs_n[None, :] * stride_bn)
          b_val_ptrs = b_ptr + (offs_k[:, None] * stride_bk + (offs_n[None, :] + N_HALF) * stride_bn)

          # Scale pointer for dynamic quantization of B tiles
          # Scale shape is [K // BLOCK_K, 2 * (N // BLOCK_N)]
          num_n_blocks = (2 * N_HALF) // BLOCK_N
          scale_gate_base = scale_b_ptr + tile_n
          scale_val_base = scale_b_ptr + (tile_n + num_n_blocks // 2)

          # 3. K-reduction loop
          num_k_steps = tl.cdiv(K, BLOCK_K)
          for k_step in range(0, num_k_steps):
              # Dynamic micro-tile scale loaded per K-block
              scale_g = tl.load(scale_gate_base + k_step * num_n_blocks)
              scale_v = tl.load(scale_val_base + k_step * num_n_blocks)

              # Load tiles
              a = tl.load(a_ptrs)
              b_g = tl.load(b_gate_ptrs)
              b_v = tl.load(b_val_ptrs)

              # In-register dequantization/scaling
              b_g = (b_g.to(tl.float32) * scale_g).to(tl.float16)
              b_v = (b_v.to(tl.float32) * scale_v).to(tl.float16)

              # Matmul step
              acc_gate = tl.dot(a, b_g, acc_gate)
              acc_val = tl.dot(a, b_v, acc_val)

              # Advance pointers
              a_ptrs += BLOCK_K * stride_ak
              b_gate_ptrs += BLOCK_K * stride_bk
              b_val_ptrs += BLOCK_K * stride_bk

          # 4. Fused SwiGLU epilogue: out = (acc_gate * sigmoid(acc_gate)) * acc_val
          sigmoid_gate = 1.0 / (1.0 + tl.exp(-acc_gate))
          silu_gate = acc_gate * sigmoid_gate
          out_tile = (silu_gate * acc_val).to(tl.float16)

          # 5. Scatter store
          out_ptrs = out_ptr + (offs_m[:, None] * stride_out_m + offs_n[None, :] * stride_out_n)
          tl.store(out_ptrs, out_tile)
    timeout_sec: 900.0
    metadata:
      uid: CSAT030
      category: GPU Kernel to PyTorch API conversion
      sub_category: Triton matmul to PyTorch
      difficulty: Moderate
      has_code: 'Yes'
      baseline_result: Stumped
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        A correct answer should preserve the LUT-based sparse tile selection, blockwise scaling of the gate and value weights, both matmuls, and the SwiGLU output. The PyTorch version should place each computed tile into the same [tile_m, tile_n] location as the Triton kernel. It should construct the blocked output layout correctly before scattering the active tiles and return the final [M, N_HALF] tensor using standard PyTorch operations that OpenXLA can compile.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The dense solution is not equivalent because it ignores the LUT and computes the full output. The LUT-based solution also uses the wrong output block layout. It views a row-major [M, N] tensor directly as [M_blocks, N_blocks, BLOCK_M, BLOCK_N], so the active tiles are written to the wrong positions.
      weight: 0.5
