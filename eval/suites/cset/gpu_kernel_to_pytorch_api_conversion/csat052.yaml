# CSAT052 from the "GPU Kernel to PyTorch API conversion" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat052
    prompt: |-
      This is the last kernel standing between us and training on v6e and I have
      been putting it off. We already have flash attention forward as plain torch
      ops on TPU and it is fine, the forward keeps the LSE and the output like the
      Triton version does. Backward is the problem. Plain autograd through our
      torch forward blows past HBM at our sizes, so I want the backward done the
      way this kernel does it, streaming over key blocks and recomputing the
      probabilities from the saved LSE. Our config is causal, no bias, head dim
      128, sequence 8192 for both q and k, batch 4, 32 heads, bf16 tensors, one
      v6e chip per replica with 32 GB. It needs to be plain PyTorch that OpenXLA
      compiles, wired in as a proper backward so the optimizer sees real
      gradients. Our regression gate compares dq, dk and dv against the CUDA path
      bit for bit and I want to keep that gate. The part I honestly do not
      understand is the sequence parallel branch, the atomic_add on dq, I keep
      reading TPUs have no atomics, so is that whole branch just dead for us and
      what do I do instead. And as always, compile once, run steady, nothing
      bouncing to the host.
      @triton.jit
      def _bwd_preprocess_do_o_dot(
      Out,
      DO,
      Delta,
      stride_ob,
      stride_oh,
      stride_om,
      stride_dob,
      stride_doh,
      stride_dom,
      nheads,
      seqlen_q,
      seqlen_q_rounded,
      headdim,
      BLOCK_M: tl.constexpr,
      BLOCK_HEADDIM: tl.constexpr,
      ):
      start_m = tl.program_id(0)
      off_hb = tl.program_id(1)
      off_b = off_hb // nheads
      off_h = off_hb % nheads
      # initialize offsets
      offs_m = start_m * BLOCK_M + tl.arange(0, BLOCK_M)
      offs_d = tl.arange(0, BLOCK_HEADDIM)
      # load
      o = tl.load(
      Out + off_b * stride_ob + off_h * stride_oh + offs_m[:, None] * stride_om + offs_d[None, :],
      mask=(offs_m[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      other=0.0,
      ).to(tl.float32)
      do = tl.load(
      DO
      + off_b * stride_dob
      + off_h * stride_doh
      + offs_m[:, None] * stride_dom
      + offs_d[None, :],
      mask=(offs_m[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      other=0.0,
      ).to(tl.float32)
      delta = tl.sum(o * do, axis=1)
      # write-back
      tl.store(Delta + off_hb * seqlen_q_rounded + offs_m, delta)
      @triton.jit
      def _bwd_store_dk_dv(
      dk_ptrs,
      dv_ptrs,
      dk,
      dv,
      offs_n,
      offs_d,
      seqlen_k,
      headdim,
      EVEN_M: tl.constexpr,
      EVEN_N: tl.constexpr,
      EVEN_HEADDIM: tl.constexpr,
      ):
      # [2022-11-01] TD: Same bug. In the case of EVEN_N=True and EVEN_M=False,
      # if we just call tl.store(dv_ptrs), there's a race condition
      if EVEN_N & EVEN_M:
      if EVEN_HEADDIM:
      tl.store(dv_ptrs, dv)
      tl.store(dk_ptrs, dk)
      else:
      tl.store(dv_ptrs, dv, mask=offs_d[None, :] < headdim)
      tl.store(dk_ptrs, dk, mask=offs_d[None, :] < headdim)
      else:
      if EVEN_HEADDIM:
      tl.store(dv_ptrs, dv, mask=offs_n[:, None] < seqlen_k)
      tl.store(dk_ptrs, dk, mask=offs_n[:, None] < seqlen_k)
      else:
      tl.store(dv_ptrs, dv, mask=(offs_n[:, None] < seqlen_k) & (offs_d[None, :] < headdim))
      tl.store(dk_ptrs, dk, mask=(offs_n[:, None] < seqlen_k) & (offs_d[None, :] < headdim))
      @triton.jit
      def _bwd_kernel_one_col_block(
      start_n,
      Q,
      K,
      V,
      Bias,
      DO,
      DQ,
      DK,
      DV,
      LSE,
      D,
      softmax_scale,
      stride_qm,
      stride_kn,
      stride_vn,
      stride_bm,
      stride_dom,
      stride_dqm,
      stride_dkn,
      stride_dvn,
      seqlen_q,
      seqlen_k,
      headdim,
      ATOMIC_ADD: tl.constexpr,
      BIAS_TYPE: tl.constexpr,
      IS_CAUSAL: tl.constexpr,
      BLOCK_HEADDIM: tl.constexpr,
      EVEN_M: tl.constexpr,
      EVEN_N: tl.constexpr,
      EVEN_HEADDIM: tl.constexpr,
      BLOCK_M: tl.constexpr,
      BLOCK_N: tl.constexpr,
      ):
      # We need to make sure begin_m is a multiple of BLOCK_M (not BLOCK_N)
      begin_m = 0 if not IS_CAUSAL else ((start_n * BLOCK_N) // BLOCK_M) * BLOCK_M
      # initialize row/col offsets
      offs_qm = begin_m + tl.arange(0, BLOCK_M)
      offs_n = start_n * BLOCK_N + tl.arange(0, BLOCK_N)
      offs_m = tl.arange(0, BLOCK_M)
      offs_d = tl.arange(0, BLOCK_HEADDIM)
      # initialize pointers to value-like data
      q_ptrs = Q + (offs_qm[:, None] * stride_qm + offs_d[None, :])
      k_ptrs = K + (offs_n[:, None] * stride_kn + offs_d[None, :])
      v_ptrs = V + (offs_n[:, None] * stride_vn + offs_d[None, :])
      do_ptrs = DO + (offs_qm[:, None] * stride_dom + offs_d[None, :])
      dq_ptrs = DQ + (offs_qm[:, None] * stride_dqm + offs_d[None, :])
      if BIAS_TYPE == "vector":
      b_ptrs = Bias + offs_n
      elif BIAS_TYPE == "matrix":
      b_ptrs = Bias + (offs_qm[:, None] * stride_bm + offs_n[None, :])
      # initialize dv and dk
      dv = tl.zeros([BLOCK_N, BLOCK_HEADDIM], dtype=tl.float32)
      dk = tl.zeros([BLOCK_N, BLOCK_HEADDIM], dtype=tl.float32)
      # There seems to be some problem with Triton pipelining that makes results wrong for
      # headdim=64, seqlen=(113, 255), bias_type='matrix'. In this case the for loop
      # may have zero step, and pipelining with the bias matrix could screw it up.
      # So we just exit early.
      if begin_m >= seqlen_q:
      dv_ptrs = DV + (offs_n[:, None] * stride_dvn + offs_d[None, :])
      dk_ptrs = DK + (offs_n[:, None] * stride_dkn + offs_d[None, :])
      _bwd_store_dk_dv(
      dk_ptrs,
      dv_ptrs,
      dk,
      dv,
      offs_n,
      offs_d,
      seqlen_k,
      headdim,
      EVEN_M=EVEN_M,
      EVEN_N=EVEN_N,
      EVEN_HEADDIM=EVEN_HEADDIM,
      )
      return
      # k and v stay in SRAM throughout
      # [2022-10-30] TD: Same bug as the fwd. In the case of EVEN_N=True and EVEN_M=False,
      # if we just call tl.load(k_ptrs), we get the wrong output!
      if EVEN_N & EVEN_M:
      if EVEN_HEADDIM:
      k = tl.load(k_ptrs)
      v = tl.load(v_ptrs)
      else:
      k = tl.load(k_ptrs, mask=offs_d[None, :] < headdim, other=0.0)
      v = tl.load(v_ptrs, mask=offs_d[None, :] < headdim, other=0.0)
      else:
      if EVEN_HEADDIM:
      k = tl.load(k_ptrs, mask=offs_n[:, None] < seqlen_k, other=0.0)
      v = tl.load(v_ptrs, mask=offs_n[:, None] < seqlen_k, other=0.0)
      else:
      k = tl.load(
      k_ptrs, mask=(offs_n[:, None] < seqlen_k) & (offs_d[None, :] < headdim), other=0.0
      )
      v = tl.load(
      v_ptrs, mask=(offs_n[:, None] < seqlen_k) & (offs_d[None, :] < headdim), other=0.0
      )
      # loop over rows
      num_block_m = tl.cdiv(seqlen_q, BLOCK_M)
      for start_m in range(begin_m, num_block_m * BLOCK_M, BLOCK_M):
      start_m = tl.multiple_of(start_m, BLOCK_M)
      offs_m_curr = start_m + offs_m
      # load q, k, v, do on-chip
      # Same bug as below. Otherwise gives wrong result for headdim=40, seqlen=(128, 117)
      if EVEN_M & EVEN_HEADDIM:
      q = tl.load(q_ptrs)
      else:
      if EVEN_HEADDIM:
      q = tl.load(q_ptrs, mask=offs_m_curr[:, None] < seqlen_q, other=0.0)
      else:
      q = tl.load(
      q_ptrs,
      mask=(offs_m_curr[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      other=0.0,
      )
      # recompute p = softmax(qk, dim=-1).T
      qk = tl.dot(q, k, trans_b=True)
      # Trying to combine the two masks seem to make the result wrong
      if not EVEN_N:  # Need to mask out otherwise the softmax is wrong
      qk = tl.where(offs_n[None, :] < seqlen_k, qk, float("-inf"))
      if IS_CAUSAL:
      qk = tl.where(offs_m_curr[:, None] >= (offs_n[None, :]), qk, float("-inf"))
      if BIAS_TYPE != "none":
      tl.debug_barrier()  # Race condition otherwise
      if BIAS_TYPE == "vector":
      if EVEN_N:
      bias = tl.load(b_ptrs).to(tl.float32)
      else:
      bias = tl.load(b_ptrs, mask=offs_n < seqlen_k, other=0.0).to(tl.float32)
      bias = bias[None, :]
      elif BIAS_TYPE == "matrix":
      if EVEN_M & EVEN_N:
      bias = tl.load(b_ptrs).to(tl.float32)
      else:
      bias = tl.load(
      b_ptrs,
      mask=(offs_m_curr[:, None] < seqlen_q) & (offs_n[None, :] < seqlen_k),
      other=0.0,
      ).to(tl.float32)
      qk = qk * softmax_scale + bias
      # There seems to be a race condition when headdim=48/96, and dq, dk, dv are wrong.
      # Also wrong for headdim=64.
      if not (EVEN_M & EVEN_HEADDIM):
      tl.debug_barrier()
      lse_i = tl.load(LSE + offs_m_curr)
      if BIAS_TYPE == "none":
      p = tl.exp(qk * softmax_scale - lse_i[:, None])
      else:
      p = tl.exp(qk - lse_i[:, None])
      # compute dv
      # [2022-10-30] TD: A Triton bug: if EVEN_M=True and EVEN_HEADDIM=False, if we call
      # do = tl.load(do_ptrs, mask=offs_d[None, :] < headdim, other=0.0), we get wrong outputs
      # in the case of headdim=48/96, seqlen_q & seqlen_k >= 512. If headdim=40 or seqlen < 512,
      # the output is correct.
      if EVEN_M & EVEN_HEADDIM:
      do = tl.load(do_ptrs)
      else:
      # [2022-11-01] TD: Triton bug, there's a race condition if we just use m_mask and not d_mask.
      do = tl.load(
      do_ptrs,
      mask=(offs_m_curr[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      other=0.0,
      )
      # if EVEN_M:
      #     if EVEN_HEADDIM:
      #         do = tl.load(do_ptrs)
      #     else:
      #         do = tl.load(do_ptrs, mask=offs_d[None, :] < headdim, other=0.0)
      # else:
      #     if EVEN_HEADDIM:
      #         do = tl.load(do_ptrs, mask=offs_m_curr[:, None] < seqlen_q, other=0.0)
      #     else:
      #         do = tl.load(do_ptrs, mask=(offs_m_curr[:, None] < seqlen_q)
      #                                    & (offs_d[None, :] < headdim), other=0.0)
      dv += tl.dot(p.to(do.dtype), do, trans_a=True)
      # compute dp = dot(v, do)
      # There seems to be a race condition when headdim=48/96, and dq, dk are wrong.
      # Also wrong for headdim=128, seqlen=(108, 256), and ATOMIC_ADD=True
      # Also wrong for headdim=64, seqlen=(1023, 1024), and ATOMIC_ADD=False
      if not (EVEN_M & EVEN_HEADDIM):
      tl.debug_barrier()
      dp = tl.dot(do, v, trans_b=True)
      # There's a race condition for headdim=48
      if not EVEN_HEADDIM:
      tl.debug_barrier()
      # compute ds = p * (dp - delta[:, None])
      # Putting the subtraction after the dp matmul (instead of before) is slightly faster
      Di = tl.load(D + offs_m_curr)
      # Converting ds to q.dtype here reduces register pressure and makes it much faster
      # for BLOCK_HEADDIM=128
      ds = (p * (dp - Di[:, None]) * softmax_scale).to(q.dtype)
      # compute dk = dot(ds.T, q)
      dk += tl.dot(ds, q, trans_a=True)
      # compute dq
      if not (
      EVEN_M & EVEN_HEADDIM
      ):  # Otherewise there's a race condition when BIAS_TYPE='matrix'
      tl.debug_barrier()
      if not ATOMIC_ADD:
      if EVEN_M & EVEN_HEADDIM:  # Race condition if we just do EVEN_M
      dq = tl.load(dq_ptrs, eviction_policy="evict_last")
      dq += tl.dot(ds, k)
      tl.store(dq_ptrs, dq, eviction_policy="evict_last")
      else:
      if EVEN_HEADDIM:
      dq = tl.load(
      dq_ptrs,
      mask=offs_m_curr[:, None] < seqlen_q,
      other=0.0,
      eviction_policy="evict_last",
      )
      dq += tl.dot(ds, k)
      tl.store(
      dq_ptrs,
      dq,
      mask=offs_m_curr[:, None] < seqlen_q,
      eviction_policy="evict_last",
      )
      else:
      dq = tl.load(
      dq_ptrs,
      mask=(offs_m_curr[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      other=0.0,
      eviction_policy="evict_last",
      )
      dq += tl.dot(ds, k)
      tl.store(
      dq_ptrs,
      dq,
      mask=(offs_m_curr[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      eviction_policy="evict_last",
      )
      else:  # If we're parallelizing across the seqlen_k dimension
      dq = tl.dot(ds, k)
      if EVEN_M & EVEN_HEADDIM:  # Race condition if we just do EVEN_M
      tl.atomic_add(dq_ptrs, dq)
      else:
      if EVEN_HEADDIM:
      tl.atomic_add(dq_ptrs, dq, mask=offs_m_curr[:, None] < seqlen_q)
      else:
      tl.atomic_add(
      dq_ptrs,
      dq,
      mask=(offs_m_curr[:, None] < seqlen_q) & (offs_d[None, :] < headdim),
      )
      # increment pointers
      dq_ptrs += BLOCK_M * stride_dqm
      q_ptrs += BLOCK_M * stride_qm
      do_ptrs += BLOCK_M * stride_dom
      if BIAS_TYPE == "matrix":
      b_ptrs += BLOCK_M * stride_bm
      # write-back
      dv_ptrs = DV + (offs_n[:, None] * stride_dvn + offs_d[None, :])
      dk_ptrs = DK + (offs_n[:, None] * stride_dkn + offs_d[None, :])
      _bwd_store_dk_dv(
      dk_ptrs,
      dv_ptrs,
      dk,
      dv,
      offs_n,
      offs_d,
      seqlen_k,
      headdim,
      EVEN_M=EVEN_M,
      EVEN_N=EVEN_N,
      EVEN_HEADDIM=EVEN_HEADDIM,
      )
      def init_to_zero(name):
      return lambda nargs: nargs[name].zero_()
      @triton.autotune(
      configs=[
      triton.Config(
      {"BLOCK_M": 128, "BLOCK_N": 128, "SEQUENCE_PARALLEL": False},
      num_warps=8,
      num_stages=1,
      pre_hook=init_to_zero("DQ"),
      ),
      triton.Config(
      {"BLOCK_M": 128, "BLOCK_N": 128, "SEQUENCE_PARALLEL": True},
      num_warps=8,
      num_stages=1,
      pre_hook=init_to_zero("DQ"),
      ),
      # Other configs seem to give wrong results when seqlen_q % 128 != 0, disabling them for now
      # # Kernel is buggy (give wrong result) if we set BLOCK_m=128, BLOCK_n=64, num_warps=4
      # triton.Config({"BLOCK_M": 128, "BLOCK_N": 64, "SEQUENCE_PARALLEL": False}, num_warps=8, num_stages=1, pre_hook=init_to_zero('DQ')),
      # triton.Config({"BLOCK_M": 128, "BLOCK_N": 64, "SEQUENCE_PARALLEL": True}, num_warps=8, num_stages=1, pre_hook=init_to_zero('DQ')),
      # triton.Config({"BLOCK_M": 64, "BLOCK_N": 64, "SEQUENCE_PARALLEL": False}, num_warps=4, num_stages=1, pre_hook=init_to_zero('DQ')),
      # triton.Config({"BLOCK_M": 64, "BLOCK_N": 64, "SEQUENCE_PARALLEL": True}, num_warps=4, num_stages=1, pre_hook=init_to_zero('DQ')),
      ],
      key=["CACHE_KEY_SEQLEN_Q", "CACHE_KEY_SEQLEN_K", "BIAS_TYPE", "IS_CAUSAL", "BLOCK_HEADDIM"],
      )
      @triton.heuristics(
      {
      "EVEN_M": lambda args: args["seqlen_q"] % args["BLOCK_M"] == 0,
      "EVEN_N": lambda args: args["seqlen_k"] % args["BLOCK_N"] == 0,
      "EVEN_HEADDIM": lambda args: args["headdim"] == args["BLOCK_HEADDIM"],
      }
      )
      @triton.jit
      def _bwd_kernel(
      Q,
      K,
      V,
      Bias,
      DO,
      DQ,
      DK,
      DV,
      LSE,
      D,
      softmax_scale,
      stride_qb,
      stride_qh,
      stride_qm,
      stride_kb,
      stride_kh,
      stride_kn,
      stride_vb,
      stride_vh,
      stride_vn,
      stride_bb,
      stride_bh,
      stride_bm,
      stride_dob,
      stride_doh,
      stride_dom,
      stride_dqb,
      stride_dqh,
      stride_dqm,
      stride_dkb,
      stride_dkh,
      stride_dkn,
      stride_dvb,
      stride_dvh,
      stride_dvn,
      nheads,
      seqlen_q,
      seqlen_k,
      seqlen_q_rounded,
      headdim,
      CACHE_KEY_SEQLEN_Q,
      CACHE_KEY_SEQLEN_K,
      BIAS_TYPE: tl.constexpr,
      IS_CAUSAL: tl.constexpr,
      BLOCK_HEADDIM: tl.constexpr,
      SEQUENCE_PARALLEL: tl.constexpr,
      EVEN_M: tl.constexpr,
      EVEN_N: tl.constexpr,
      EVEN_HEADDIM: tl.constexpr,
      BLOCK_M: tl.constexpr,
      BLOCK_N: tl.constexpr,
      ):
      off_hb = tl.program_id(1)
      off_b = off_hb // nheads
      off_h = off_hb % nheads
      # offset pointers for batch/head
      Q += off_b * stride_qb + off_h * stride_qh
      K += off_b * stride_kb + off_h * stride_kh
      V += off_b * stride_vb + off_h * stride_vh
      DO += off_b * stride_dob + off_h * stride_doh
      DQ += off_b * stride_dqb + off_h * stride_dqh
      DK += off_b * stride_dkb + off_h * stride_dkh
      DV += off_b * stride_dvb + off_h * stride_dvh
      if BIAS_TYPE != "none":
      Bias += off_b * stride_bb + off_h * stride_bh
      # pointer to row-wise quantities in value-like data
      D += off_hb * seqlen_q_rounded
      LSE += off_hb * seqlen_q_rounded
      if not SEQUENCE_PARALLEL:
      num_block_n = tl.cdiv(seqlen_k, BLOCK_N)
      for start_n in range(0, num_block_n):
      _bwd_kernel_one_col_block(
      start_n,
      Q,
      K,
      V,
      Bias,
      DO,
      DQ,
      DK,
      DV,
      LSE,
      D,
      softmax_scale,
      stride_qm,
      stride_kn,
      stride_vn,
      stride_bm,
      stride_dom,
      stride_dqm,
      stride_dkn,
      stride_dvn,
      seqlen_q,
      seqlen_k,
      headdim,
      ATOMIC_ADD=False,
      BIAS_TYPE=BIAS_TYPE,
      IS_CAUSAL=IS_CAUSAL,
      BLOCK_HEADDIM=BLOCK_HEADDIM,
      EVEN_M=EVEN_M,
      EVEN_N=EVEN_N,
      EVEN_HEADDIM=EVEN_HEADDIM,
      BLOCK_M=BLOCK_M,
      BLOCK_N=BLOCK_N,
      )
      else:
      start_n = tl.program_id(0)
      _bwd_kernel_one_col_block(
      start_n,
      Q,
      K,
      V,
      Bias,
      DO,
      DQ,
      DK,
      DV,
      LSE,
      D,
      softmax_scale,
      stride_qm,
      stride_kn,
      stride_vn,
      stride_bm,
      stride_dom,
      stride_dqm,
      stride_dkn,
      stride_dvn,
      seqlen_q,
      seqlen_k,
      headdim,
      ATOMIC_ADD=True,
      BIAS_TYPE=BIAS_TYPE,
      IS_CAUSAL=IS_CAUSAL,
      BLOCK_HEADDIM=BLOCK_HEADDIM,
      EVEN_M=EVEN_M,
      EVEN_N=EVEN_N,
      EVEN_HEADDIM=EVEN_HEADDIM,
      BLOCK_M=BLOCK_M,
      BLOCK_N=BLOCK_N,
      )
    timeout_sec: 900.0
    metadata:
      uid: CSAT052
      category: GPU Kernel to PyTorch API conversion
      sub_category: Cross-block atomics mapping
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        A good answer first refuses the bit for bit gate, since the sequence parallel branch accumulates dq with atomic adds whose order changes run to run and the autotuner flips between the atomic and non atomic configs, so the CUDA reference is not stable and CI needs a tolerance. Then it ports the math not the tiling, delta from rowsum of O times dO, probabilities recomputed per key block from the saved LSE, ds equals p times dp minus delta times scale, dk and dv accumulated in fp32, dq accumulated with plain adds in a static loop that never materializes the 8192 by 8192 matrices, about 34 GB in fp32, reproducing the kernel's bf16 rounding of p and ds if parity is the goal, all wired in as a real autograd backward.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

