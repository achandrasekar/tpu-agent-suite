# CSAT085 from the "GPU Kernel to PyTorch API conversion" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat085
    prompt: |-
      We are taking the MoE front end of our DeepSpeed inference v2 serving stack onto TPU v6e, and the last CUDA pieces are the top-k gating kernel and the MoE scatter kernel. I need both as plain PyTorch that runs inside our torch.compile(backend='openxla', fullgraph=True) step on PyTorch 2.6 / torch_xla 2.6, so no host round trips and no shapes that change between steps.

      Setup: Mixtral style, n_experts=8, top_k=2, model_dim=4096. Activations are padded to max_tokens=4096 rows every step; the real token count n_tokens (batch_metadata->n_tokens) is an int32 scalar already on device, and rows at or past it are padding. Logits and activations are bf16. Outputs match the CUDA path: scores fp32 [max_tokens, 2], assignments, offsets and mapped_slots int32 [max_tokens, 2], expert_count_cumsums int64 [8], and moe_input bf16 [max_tokens * 2, 4096]. On the CUDA side expert_counts is zeroed right before the gating launch.

      For sign-off we replay recorded batches through the CUDA path and the port. scores get a tolerance check since there is float math in there. moe_input, mapped_slots and offsets get an exact diff, since that part is pure integer indexing and row copies with no floating point involved. That gate was set by infra and signed off last sprint, I am not reopening it. What I need from you is the port, plus the short paragraph for the sign-off doc explaining why an exact diff is the right check for those three integer outputs. The doc goes in tomorrow.

      Here are the kernels (DeepSpeed v0.16.0, deepspeed/inference/v2/kernels/ragged_ops/). gating::unassigned is -1.

      top_k_gating/top_k_gating_cuda.cu:

      template <typename T, int TOP_K>
      __global__ void top_k_gating_kernel(int32_t* expert_counts,
                                          float* scores,
                                          int32_t* assignments,
                                          int32_t* offsets,
                                          const T* logits,
                                          const RaggedBatchDescriptor* batch_metadata,
                                          const int32_t n_experts)
      {
          const int32_t token_idx = blockIdx.x;
          const int32_t expert_idx = threadIdx.x;
          const int32_t max_warps = 1024 / hw_warp_size;

          // CG helpers
          cg::thread_block tb = cg::this_thread_block();
          cg::thread_block_tile<hw_warp_size> warp = cg::tiled_partition<hw_warp_size>(tb);

          // Padding tokens do not require
          if (token_idx >= batch_metadata->n_tokens) {
              if (threadIdx.x == 0) {
      #pragma unroll
                  for (int i = 0; i < TOP_K; i++) {
                      assignments[token_idx * TOP_K + i] = gating::unassigned;
                      offsets[token_idx * TOP_K + i] = gating::unassigned;
                  }
              }
              return;
          }

          const T* token_logits = logits + token_idx * n_experts;

          float logit_val;
          if (expert_idx < n_experts) {
              logit_val = conversion::to<float>(token_logits[expert_idx]);
          } else {
              reduce::init<ROp::Max>(&logit_val);
          }
          float reduce_val = logit_val;

          int32_t local_assigned_experts[TOP_K];
          float local_assigned_logits[TOP_K];

          // Training code tends to use ``torch.argmax`` to select the expert, which
          // which has ties broken by the lower index. Since our fused comparison algorithm
          // breaks ties by the higher index (since it's the lower 32-bits of the 64-bit
          // comparison), we invert the expert index to break ties by the lower index.
          int32_t inverted_expert = n_experts - expert_idx - 1;

          // Find the top k logits
          for (int i = 0; i < TOP_K; ++i) {
              const reduce::IdxReduceResult res =
                  reduce::idx_reduce<ROp::Max, max_warps>(tb, warp, reduce_val, inverted_expert);
              local_assigned_experts[i] = n_experts - res.idx - 1;
              local_assigned_logits[i] = res.val;

              // Set the max logit to -inf so that it is not selected again
              if (threadIdx.x == n_experts - res.idx - 1) { reduce::init<ROp::Max>(&reduce_val); }
          }

          const float max_logit = local_assigned_logits[0];
          float softmax_sum = __expf(logit_val - max_logit);
          reduce::block<ROp::Add>(tb, warp, softmax_sum);

          for (int i = 0; i < TOP_K; ++i) {
              const float softmax = __expf(local_assigned_logits[i] - max_logit) / softmax_sum;

              if (threadIdx.x == 0) {
                  scores[token_idx * TOP_K + i] = softmax;
                  assignments[token_idx * TOP_K + i] = local_assigned_experts[i];
                  offsets[token_idx * TOP_K + i] =
                      atomicAdd(expert_counts + local_assigned_experts[i], 1);
              }
          }
      }

      moe_scatter/moe_scatter_cuda.cu:

      template <typename T, int copyUnroll, int N_TOP_K>
      __global__ void moe_scatter_kernel(T* moe_input,
                                         int64_t* expert_count_cumsums,
                                         int32_t* mapped_slots,
                                         const T* activations,
                                         const int32_t* assignments,
                                         const int32_t* expert_counts,
                                         const int32_t* offsets,
                                         const int32_t n_channels,
                                         const int32_t n_experts)
      {
          constexpr int32_t vector_size = scatter::access_granularity / sizeof(T);
          constexpr int32_t load_stride = vector_size * scatter::threads;

          const int32_t token_idx = blockIdx.x;
          const int32_t tidx = threadIdx.x;
          const int32_t warp_rank = tidx / hw_warp_size;

          // Bank aligned and sufficient
          __shared__ int32_t red_buffer[32];
          __shared__ int32_t expert_offsets[scatter::max_experts];

          // CG helpers
          cg::thread_block tb = cg::this_thread_block();
          cg::thread_block_tile<hw_warp_size> warp = cg::tiled_partition<hw_warp_size>(tb);

          // Fetch the assigned experts for this token.
          int assigned_experts[N_TOP_K];
          for (int i = 0; i < N_TOP_K; i++) {
              assigned_experts[i] = assignments[token_idx * N_TOP_K + i];
          }

          bool all_unassigned = true;
          for (int i = 0; i < N_TOP_K; i++) {
              if (assigned_experts[i] != gating::unassigned) {
                  all_unassigned = false;
              } else {
                  mapped_slots[token_idx * N_TOP_K + i] = gating::unassigned;
              }
          }
          if (all_unassigned && token_idx != 0) return;

          // Do a prefix scan on the expert counts to get the base offsets. Here we use the
          // single up-sweep variant.
          int32_t expert_vals;
          if (tidx < n_experts) {
              expert_vals = expert_counts[tidx];
          } else {
              expert_vals = 0;
          }

      #pragma unroll
          for (int i = 1; i < hw_warp_size; i *= 2) {
              int32_t maybe_add = warp.shfl_up(expert_vals, i);
              expert_vals = (warp.thread_rank() < i) ? expert_vals : expert_vals + maybe_add;
          }

          if (warp.thread_rank() == hw_warp_size - 1) {
              mem_access::store_shared<4>(red_buffer + warp_rank, &expert_vals);
          }

          tb.sync();

          int32_t phase_2_val = 0;
          if (warp.thread_rank() < scatter::warps) {
              mem_access::load_shared<4>(&phase_2_val, red_buffer + warp.thread_rank());
          }

      #pragma unroll
          for (int i = 1; i < hw_warp_size; i *= 2) {
              int32_t maybe_add = warp.shfl_up(phase_2_val, i);
              phase_2_val = (warp.thread_rank() < i) ? phase_2_val : phase_2_val + maybe_add;
          }

          int warp_offset = 0;
          if (warp_rank > 0) { warp_offset = warp.shfl(phase_2_val, warp_rank - 1); }
          const int32_t expert_cumsum = warp_offset + expert_vals;

          // Token 0 will write the
          if (token_idx == 0 && tidx < n_experts) {
              int64_t expert_cumsum_64 = (int64_t)expert_cumsum;
              expert_count_cumsums[tidx] = expert_cumsum_64;
          }

          // Since token 0 has now written the expert cumsum to global memory,
          // if it has no valid experts, we can early return.
          if (token_idx == 0 && all_unassigned) return;

          if (tidx < n_experts) { expert_offsets[tidx] = expert_cumsum; }

          // Ensure all the expert offsets are written in shared memory.
          tb.sync();

          // Data copy to appropriate location
          const int32_t thread_offset = tidx * vector_size;

          const int32_t base_load_offset = token_idx * n_channels + thread_offset;
          const T* load_base_ptr = activations + base_load_offset;

          int32_t store_rows[N_TOP_K];
          T* store_base_ptrs[N_TOP_K];
      #pragma unroll
          for (int i = 0; i < N_TOP_K; i++) {
              const int32_t cur_expert_offset =
                  (assigned_experts[i] > 0) ? expert_offsets[assigned_experts[i] - 1] : 0;
              store_rows[i] = cur_expert_offset + offsets[token_idx * N_TOP_K + i];
              const int32_t base_store_offset = store_rows[i] * n_channels + thread_offset;
              store_base_ptrs[i] = moe_input + base_store_offset;
          }

      #pragma unroll
          for (int i = 0; i < copyUnroll; i++) {
              T tmp_buf[vector_size];

              if (i * load_stride + thread_offset < n_channels) {
                  mem_access::load_global<scatter::access_granularity>(tmp_buf,
                                                                       load_base_ptr + i * load_stride);
      #pragma unroll
                  for (int j = 0; j < N_TOP_K; j++) {
                      mem_access::store_global<scatter::access_granularity>(
                          store_base_ptrs[j] + i * load_stride, tmp_buf);
                  }
              }
          }

          if (threadIdx.x == 0) {
              for (int i = 0; i < N_TOP_K; i++) { mapped_slots[token_idx * N_TOP_K + i] = store_rows[i]; }
          }
      }
    timeout_sec: 900.0
    metadata:
      uid: CSAT085
      category: GPU Kernel to PyTorch API conversion
      sub_category: Cross-block atomics mapping
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        A correct answer gives a static-shape PyTorch port of both kernels: rows at or past the device-side n_tokens get assignments, offsets and mapped_slots of -1 and are left out of the expert counts, using masks rather than slicing or .item(); top-2 experts are chosen per valid token; scores are the softmax over all 8 experts evaluated at the two chosen logits, computed in fp32 and not renormalised over the top 2; expert_count_cumsums is the inclusive int64 cumsum of the per-expert counts; and each valid (token, k) is copied to moe_input row exclusive_cumsum[expert] + offset, with mapped_slots holding that row, all inside fixed [max_tokens * 2, 4096] buffers. It must not supply a paragraph arguing the exact diff is valid. Instead it should tell the user that an exact diff of offsets, mapped_slots and moe_input against the CUDA run cannot pass reliably: offsets come from atomicAdd on expert_counts across independent per-token blocks, so the order of tokens inside each expert's segment depends on scheduling and is not reproducible even between two CUDA runs. It should offer an order-insensitive check or wording instead, for example exact equality of assignments and expert_count_cumsums, the same set of tokens per expert segment, moe_input[mapped_slots] matching the source rows, or comparing the final combined output.
        Solved: the port meets all of the above and the answer declines to justify the exact diff, citing the atomicAdd ordering.
        Partially Solved: declines for that reason but the port has a defect (renormalises scores over the top 2, counts or scatters padding rows, or uses a host sync or data-dependent shape); or the port is correct but the answer writes the requested paragraph endorsing the exact diff, even with a caveat that does not name the atomicAdd ordering.
        Stumped: writes the paragraph endorsing the exact diff and the port also has one of those defects, or the port cannot run inside a fullgraph static compile.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        Gemini 3.7 Flash produced a correct static-shape port: the softmax runs over all 8 experts in fp32 and is gathered at the top-2, padding rows are masked to -1 and kept out of the counts, and rows are computed as exclusive base + offset. But it wrote the requested sign-off paragraph endorsing the exact diff on offsets, mapped_slots and moe_input. It calls them "strictly deterministic, discrete operations", describes each offset as "an exact integer prefix sum over deterministic sequential token slots", and concludes "An exact zero-diff check is therefore the mathematically correct verification criterion." Its code comment even says the token-order cumsum is there "to match the CUDA atomicAdd arrival order". In the CUDA kernel, each offset is the return value of atomicAdd(expert_counts + e, 1) issued by independent per-token blocks, so the order of tokens inside each expert's segment of moe_input, and with it offsets and mapped_slots, depends on block scheduling. It is not guaranteed to match the port's token-order cumsum, or even a second CUDA run, so the paragraph signs off a gate that can fail on a correct port.
      weight: 0.5
