# CSAT154 from the "GPU Kernel to PyTorch API conversion" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat154
    prompt: |-
      Convert this Triton kernel to an equivalent PyTorch implementation while preserving the exact numerical semantics and KV-cache layour:

      @triton.jit
      def _tq_decode_stage1(
          # Precomputed query projection
          Q_rot_ptr,  # [B, Hq, D] float32
          # Compressed KV cache (combined K+V)
          KV_cache_ptr,  # [num_blocks, block_size, Hk, padded_slot] uint8
          # Block table and sequence info
          Block_table_ptr,  # [B, max_num_blocks] int32
          Seq_lens_ptr,  # [B] int32
          # TQ parameters
          Centroids_ptr,  # [n_centroids] float32
          # Output (intermediate for stage2)
          Mid_o_ptr,  # [B, Hq, NUM_KV_SPLITS, D+1] float32
          # Strides
          stride_qb,
          stride_qh,  # Q strides: [B, Hq, D]
          stride_cache_block,
          stride_cache_pos,
          stride_cache_head,  # KV cache
          stride_bt_b,  # block_table stride per batch
          stride_mid_b,
          stride_mid_h,
          stride_mid_s,  # mid_o strides
          # Constexpr dims
          NUM_KV_HEADS: tl.constexpr,
          HEAD_DIM: tl.constexpr,
          BLOCK_SIZE: tl.constexpr,  # KV cache block_size (pages)
          NUM_KV_SPLITS: tl.constexpr,
          KV_GROUP_SIZE: tl.constexpr,  # Hq // Hk
          # TQ layout constants
          MSE_BITS: tl.constexpr,  # 3 or 4
          MSE_BYTES: tl.constexpr,  # ceil(D * mse_bits / 8)
          KPS: tl.constexpr,  # key_packed_size
          VQB: tl.constexpr,  # value_quant_bits (4 or 8=FP8)
          VAL_DATA_BYTES: tl.constexpr,  # ceil(D * vqb / 8) or D for FP8
          # Score constants
          ATTN_SCALE: tl.constexpr,  # 1/sqrt(D)
          # Block tile sizes
          BLOCK_D: tl.constexpr,  # next_power_of_2(HEAD_DIM)
          BLOCK_KV: tl.constexpr,  # tokens per tile (16)
          KEY_FP8: tl.constexpr,  # 1 if K is stored as FP8
          NORM_CORRECTION: tl.constexpr = 0,  # 1 = re-normalize centroids
          FP8_E4B15: tl.constexpr = 0,  # 1 = use e4b15 (Ampere/Ada), 0 = e4nv (Hopper+)
      ):
          bid = tl.program_id(0)  # batch index
          hid = tl.program_id(1)  # q_head index
          sid = tl.program_id(2)  # kv_split index

          kv_head = hid // KV_GROUP_SIZE

          # Sequence length for this batch
          seq_len = tl.load(Seq_lens_ptr + bid)

          # KV split range
          split_len = tl.cdiv(seq_len, NUM_KV_SPLITS)
          split_start = split_len * sid
          split_end = tl.minimum(split_start + split_len, seq_len)

          if split_start >= split_end:
              return

          # Dimension offsets
          d_offs = tl.arange(0, BLOCK_D)
          d_mask = d_offs < HEAD_DIM
          kv_range = tl.arange(0, BLOCK_KV)

          # Load query vector: q_rot — [BLOCK_D] float32
          q_base = bid * stride_qb + hid * stride_qh
          q_rot = tl.load(Q_rot_ptr + q_base + d_offs, mask=d_mask, other=0.0).to(tl.float32)

          # Precompute byte/bit index vectors for MSE gather loads
          if not KEY_FP8:
              mse_bit_off = d_offs * MSE_BITS
              mse_byte_idx = mse_bit_off // 8
              mse_bit_shift = mse_bit_off % 8
              mse_mask = (1 << MSE_BITS) - 1

          # Precompute value bit/byte index vectors (loop-invariant)
          if VQB == 3:
              val_bit_off = d_offs * 3
              val_byte_idx = val_bit_off // 8
              val_bit_shift = val_bit_off % 8

          # Online softmax accumulators
          m_prev = -float("inf")
          l_prev = 0.0
          acc = tl.zeros([BLOCK_D], dtype=tl.float32)

          bt_base = bid * stride_bt_b

          # ================================================================
          # TILED LOOP: process BLOCK_KV tokens per iteration
          # ================================================================
          for start_n in range(split_start, split_end, BLOCK_KV):
              kv_offs = start_n + kv_range
              kv_mask = kv_offs < split_end

              page_idx = kv_offs // BLOCK_SIZE
              page_off = kv_offs % BLOCK_SIZE
              block_nums = tl.load(
                  Block_table_ptr + bt_base + page_idx,
                  mask=kv_mask,
                  other=0,
              ).to(tl.int64)

              slot_bases = (
                  block_nums * stride_cache_block
                  + page_off.to(tl.int64) * stride_cache_pos
                  + tl.cast(kv_head, tl.int64) * stride_cache_head
              )

              # ============================================================
              # COMPUTE ATTENTION SCORES: [BLOCK_KV]
              # ============================================================
              if KEY_FP8:
                  k_addrs = slot_bases[:, None] + d_offs[None, :]
                  k_raw = tl.load(
                      KV_cache_ptr + k_addrs,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0,
                  )
                  if FP8_E4B15:
                      k_float = k_raw.to(tl.float8e4b15, bitcast=True).to(tl.float32)
                  else:
                      k_float = k_raw.to(tl.float8e4nv, bitcast=True).to(tl.float32)
                  scores = (
                      tl.sum(
                          tl.where(d_mask[None, :], q_rot[None, :] * k_float, 0.0),
                          axis=1,
                      )
                      * ATTN_SCALE
                  )
                  scores = tl.where(kv_mask, scores, -float("inf"))
              else:
                  # MSE unpack + norms
                  mse_addrs0 = slot_bases[:, None] + mse_byte_idx[None, :]
                  mse_raw0 = tl.load(
                      KV_cache_ptr + mse_addrs0,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0,
                  ).to(tl.int32)
                  mse_raw1 = tl.load(
                      KV_cache_ptr + mse_addrs0 + 1,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0,
                  ).to(tl.int32)
                  raw16 = mse_raw0 | (mse_raw1 << 8)
                  mse_idx = (raw16 >> mse_bit_shift[None, :]) & mse_mask

                  # Centroid gather + dot product
                  c_vals = tl.load(
                      Centroids_ptr + mse_idx,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0.0,
                  )

                  # Norm correction: re-normalize centroid vector to unit norm
                  if NORM_CORRECTION:
                      c_norm_sq = tl.sum(
                          tl.where(d_mask[None, :], c_vals * c_vals, 0.0),
                          axis=1,
                      )
                      c_inv_norm = 1.0 / tl.sqrt(c_norm_sq + 1e-16)
                      c_vals = c_vals * c_inv_norm[:, None]

                  term1 = tl.sum(
                      tl.where(d_mask[None, :], q_rot[None, :] * c_vals, 0.0),
                      axis=1,
                  )

                  # Load norms (fp16 -> fp32): norms are at MSE_BYTES offset
                  norm_bases = slot_bases + MSE_BYTES
                  n_lo = tl.load(KV_cache_ptr + norm_bases, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  n_hi = tl.load(KV_cache_ptr + norm_bases + 1, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  vec_norms = (n_lo | (n_hi << 8)).to(tl.float16, bitcast=True).to(tl.float32)

                  scores = vec_norms * term1 * ATTN_SCALE
                  scores = tl.where(kv_mask, scores, -float("inf"))

              # ============================================================
              # ONLINE SOFTMAX UPDATE (block-level)
              # ============================================================
              n_e_max = tl.maximum(tl.max(scores, 0), m_prev)
              re_scale = tl.exp(m_prev - n_e_max)
              p = tl.exp(scores - n_e_max)

              # ============================================================
              # VALUE LOAD + DEQUANTIZE: [BLOCK_KV, BLOCK_D]
              # ============================================================
              val_bases = slot_bases + KPS

              if VQB == 3:
                  val_addrs0 = val_bases[:, None] + val_byte_idx[None, :]
                  val_raw0 = tl.load(
                      KV_cache_ptr + val_addrs0,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0,
                  ).to(tl.int32)
                  val_raw1 = tl.load(
                      KV_cache_ptr + val_addrs0 + 1,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0,
                  ).to(tl.int32)
                  raw16 = val_raw0 | (val_raw1 << 8)
                  v_idx = ((raw16 >> val_bit_shift[None, :]) & 0x7).to(tl.float32)

                  sc_bases = val_bases + VAL_DATA_BYTES
                  sc_lo = tl.load(KV_cache_ptr + sc_bases, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  sc_hi = tl.load(KV_cache_ptr + sc_bases + 1, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  v_scales = (
                      (sc_lo | (sc_hi << 8)).to(tl.float16, bitcast=True).to(tl.float32)
                  )
                  zr_lo = tl.load(KV_cache_ptr + sc_bases + 2, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  zr_hi = tl.load(KV_cache_ptr + sc_bases + 3, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  v_zeros = (zr_lo | (zr_hi << 8)).to(tl.float16, bitcast=True).to(tl.float32)
                  values = v_idx * v_scales[:, None] + v_zeros[:, None]
              else:  # VQB == 4
                  vb_idx = d_offs // 2
                  vb_shift = (d_offs % 2) * 4
                  val_addrs = val_bases[:, None] + vb_idx[None, :]
                  val_raw = tl.load(
                      KV_cache_ptr + val_addrs,
                      mask=kv_mask[:, None] & d_mask[None, :],
                      other=0,
                  ).to(tl.int32)
                  v_idx = ((val_raw >> vb_shift[None, :]) & 0xF).to(tl.float32)

                  sc_bases = val_bases + VAL_DATA_BYTES
                  sc_lo = tl.load(KV_cache_ptr + sc_bases, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  sc_hi = tl.load(KV_cache_ptr + sc_bases + 1, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  v_scales = (
                      (sc_lo | (sc_hi << 8)).to(tl.float16, bitcast=True).to(tl.float32)
                  )
                  zr_lo = tl.load(KV_cache_ptr + sc_bases + 2, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  zr_hi = tl.load(KV_cache_ptr + sc_bases + 3, mask=kv_mask, other=0).to(
                      tl.uint16
                  )
                  v_zeros = (zr_lo | (zr_hi << 8)).to(tl.float16, bitcast=True).to(tl.float32)
                  values = v_idx * v_scales[:, None] + v_zeros[:, None]

              # ============================================================
              # WEIGHTED VALUE ACCUMULATION
              # ============================================================
              acc = acc * re_scale + tl.sum(p[:, None] * values, 0)
              l_prev = l_prev * re_scale + tl.sum(p, 0)
              m_prev = n_e_max

          # Store partial result
          out_base = bid * stride_mid_b + hid * stride_mid_h + sid * stride_mid_s
          safe_l = tl.where(l_prev > 0.0, l_prev, 1.0)
          tl.store(Mid_o_ptr + out_base + d_offs, acc / safe_l, mask=d_mask)
          lse = m_prev + tl.log(safe_l)
          tl.store(Mid_o_ptr + out_base + HEAD_DIM, lse)
    timeout_sec: 900.0
    metadata:
      uid: CSAT154
      category: GPU Kernel to PyTorch API conversion
      sub_category: Triton attention to PyTorch
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        Solved: Identifies the full kernel contract and delivers a drop-in PyTorch equivalent that strictly adheres to it. Faithfully replicates the BLOCK_KV tiled online-softmax accumulation order to preserve exact numerical semantics. Resolves memory addresses directly using the provided cache byte strides (stride_cache_*) to honor arbitrary paged layouts. Correctly masks or zeros out invalid-lane values to prevent NaN/Inf contamination in floating-point reductions (0.0 * NaN = NaN), and replicates the early-exit behavior on empty splits (split_start >= split_end) by leaving preallocated output buffers untouched.

            Partially Solved: Translates the high-level computational and bit-unpacking logic (e.g., sub-byte MSE bit shifting, alignment-safe FP16 decoding, GQA head mapping, affine dequantization, and scaling), but introduces semantic drift or reduction defects. Examples include bypassing the tiled online-softmax recurrence in the default path, ignoring explicit cache byte strides, or failing to guard against NaN/Inf propagation from unmasked value lanes.

            Stumped: Fails to unpack the compressed 3-bit/4-bit bitstreams, misinterprets the packed KV-cache layout (e.g., assumes standard uncompressed float tensors), misunderstands the split-KV / multi-stage decode architecture, or produces code that fails basic execution across supported configurations.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        What the model output did well
        Accurate Sub-Byte Unpacking: Faithfully translates 3-bit and 4-bit MSE key and value extraction using 16-bit bitwise windows (raw0 | (raw1 << 8)) and correct shift-mask arithmetic across byte boundaries.
        Alignment-Safe FP16 Decoding: Correctly combines low and high bytes into int16 before reinterpreting as float16 (_unpack_fp16_from_u8), safely avoiding unaligned memory load faults.
        High-Level Math & GQA Control Flow: Accurately maps GQA head relationships (hid // kv_group_size), centroid normalizations, affine value reconstruction, and output scaling formulas.
        Early-Exit Semantics: Faithfully preserves early termination on empty splits (split_start >= split_end), keeping preallocated output buffers untouched as in the Triton kernel.Numerical Stability Guard: Accurately retains the safe_l stability check (l_prev > 0.0) and log-sum-exp accumulation formulas.

        However, it has the following defects:
        Bypassed Online Softmax (Default Path): The default path replaces the 16-token (BLOCK_KV) recurrence with a global split reduction. Because floating-point summation is non-associative, altering the accumulation grouping introduces numerical drift against the Triton reference.
        Ignored Byte Strides in Tiled Mode: The exact_tiled_reduction branch bypasses caller-provided strides (stride_cache_*) and hardcodes standard 4D tensor indexing (kv_cache[b, p, h]), breaking compatibility with non-standard, custom-padded, or linearized paged layouts.
        NaN/Inf Contamination from Unmasked Lane Decoding: Although masked-out lanes have their attention scores clamped to -infty (p = 0.0), their values are still dequantized from dummy positions. If uninitialized memory or extreme scale/zero values decode to NaN or Inf, the arithmetic operation 0.0 * NaN = NaN pollutes acc and corrupts the final output.
      weight: 0.5
