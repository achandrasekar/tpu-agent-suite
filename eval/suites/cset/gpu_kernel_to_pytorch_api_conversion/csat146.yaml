# CSAT146 from the "GPU Kernel to PyTorch API conversion" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat146
    prompt: |-
      I'm porting this TTT layer's forward pass to TPU. Convert the implementation below to standard PyTorch for execution through OpenXLA.
      @triton.heuristics({
      'USE_INITIAL_STATE': lambda args: args['h0'] is not None,
      'USE_INITIAL_STATE_B': lambda args: args['hb0'] is not None,
      'STORE_FINAL_STATE': lambda args: args['ht'] is not None,
      'IS_VARLEN': lambda args: args['cu_seqlens'] is not None,
      })
      @triton.autotune(
      configs=[
      triton.Config({}, num_warps=1),
      triton.Config({}, num_warps=2),
      triton.Config({}, num_warps=4),
      ],
      key=['BT', 'BK', 'BV'],
      **autotune_cache_kwargs,
      )
      @triton.jit(do_not_specialize=['T'])
      def fused_chunk_ttt_linear_fwd_kernel(
      q,
      k,
      v,
      eta,
      w,
      b,
      o,
      scale,
      eps,
      h0,
      hb0,
      ht,
      hbt,
      cu_seqlens,
      T,
      H: tl.constexpr,
      K: tl.constexpr,
      V: tl.constexpr,
      BT: tl.constexpr,
      BK: tl.constexpr,
      BV: tl.constexpr,
      USE_INITIAL_STATE: tl.constexpr,
      USE_INITIAL_STATE_B: tl.constexpr,
      STORE_FINAL_STATE: tl.constexpr,
      IS_VARLEN: tl.constexpr,
      ):
      i_nh = tl.program_id(0).to(tl.int64)
      i_n, i_h = i_nh // H, i_nh % H
      if IS_VARLEN:
      bos, eos = tl.load(cu_seqlens + i_n).to(tl.int64), tl.load(cu_seqlens + i_n + 1).to(tl.int64)
      T = eos - bos
      NT = tl.cdiv(T, BT)
      else:
      bos, eos = i_n * T, i_n * T + T
      NT = tl.cdiv(T, BT)
      o_i = tl.arange(0, BT)
      v_i = tl.arange(0, BV)
      m_A = o_i[:, None] >= o_i[None, :]
      b_w = tl.load(w + i_h * V + v_i, mask=v_i < V, other=0.)
      b_b = tl.load(b + i_h * V + v_i, mask=v_i < V, other=0.)
      [BK, BV]
      b_h = tl.zeros([BK, BV], dtype=tl.float32)
      [BV]
      b_hb = tl.zeros([BV], dtype=tl.float32)
      o_k = tl.arange(0, BK)
      o_v = tl.arange(0, BV)
      m_h = (o_k[:, None] < K) & (o_v[None, :] < V)
      if USE_INITIAL_STATE:
      p_h0 = h0 + i_nh * K * V + o_k[:, None] * V + o_v[None, :]
      b_h = tl.load(p_h0, mask=m_h, other=0.0).to(tl.float32)
      if USE_INITIAL_STATE_B:
      p_hb0 = hb0 + i_nh * V + o_v
      b_hb = tl.load(p_hb0, mask=o_v < V, other=0.0).to(tl.float32)
      for i_t in range(NT):
      o_t = i_t * BT + tl.arange(0, BT)
      m_t = o_t < T
      m_q = m_t[:, None] & (o_k[None, :] < K)
      m_k = (o_k[:, None] < K) & m_t[None, :]
      m_v = m_t[:, None] & (o_v[None, :] < V)
      p_q = q+(bosH+i_h)K + o_t[:, None] * (HK) + o_k[None, :]
      p_k = k+(bosH+i_h)K + o_k[:, None] + o_t[None, :] * (HK)
      p_v = v+(bosH+i_h)V + o_t[:, None] * (HV) + o_v[None, :]
      p_o = o+(bosH+i_h)V + o_t[:, None] * (HV) + o_v[None, :]
      p_e = eta+(bosH+i_h) + o_t * H
      p_e_last = eta+bosH+i_h + (T-1)H if i_t == NT-1 else eta+bosH+i_h + (i_t*BT+BT-1)*H
      # [BK, BT]
      b_k = tl.load(p_k, mask=m_k, other=0.0)
      # [BT, BV]
      b_v = tl.load(p_v, mask=m_v, other=0.0)
      # [BT, BV]
      b_kh = tl.dot(tl.trans(b_k), b_h.to(b_k.dtype), allow_tf32=False).to(tl.float32) + b_hb[None, :]
      b_kh = tl.where((v_i < V)[None, :], b_kh, 0.)
      mean = tl.sum(b_kh, axis=1, keep_dims=True) / V
      xbar = tl.where((v_i < V)[None, :], b_kh - mean, 0.)
      var = tl.sum(xbar * xbar, axis=1, keep_dims=True) / V
      rstd = 1 / tl.sqrt(var.to(tl.float32) + eps)
      b_kh_hat = (b_kh - mean) * rstd

      b_v = b_kh_hat.to(b_k.dtype) * b_w[None, :].to(b_k.dtype) + \
          b_b[None, :].to(b_k.dtype) - b_v.to(b_k.dtype) + tl.trans(b_k)
      b_v = tl.where((v_i < V)[None, :], b_v * b_w[None, :].to(b_k.dtype), 0.)
      b_v2 = rstd * (V * b_v - tl.sum(b_v, axis=1, keep_dims=True) - b_kh_hat.to(b_k.dtype)
                     * tl.sum(b_v * b_kh_hat.to(b_k.dtype), axis=1, keep_dims=True)) / V

      # [BT, BK]
      b_q = tl.load(p_q, mask=m_q, other=0.0)
      # [BT]
      b_e = tl.load(p_e, mask=m_t, other=0.0)
      b_q = (b_q * scale).to(b_k.dtype)

      # [BT, BT]
      b_A = tl.dot(b_q, b_k, allow_tf32=False)
      b_A = tl.where(m_A, b_A, 0)
      b_Ae = tl.where(m_A, b_e[:, None], 0.0)

      b_o = - tl.dot(b_e[:, None] * b_A.to(b_v2.dtype), b_v2, allow_tf32=False)
      b_o += b_hb[None, :] - tl.dot(b_Ae.to(b_v2.dtype), b_v2, allow_tf32=False)
      b_o = tl.dot(b_q, b_h.to(b_q.dtype), b_o, allow_tf32=False)
      b_e_last = tl.load(p_e_last)
      b_h = b_h - tl.dot(b_e_last * b_k, b_v2.to(b_k.dtype), allow_tf32=False)
      b_hb = b_hb - tl.sum(b_e_last * b_v2.to(b_k.dtype), axis=0)
      b_h = tl.where((v_i < V)[None, :], b_h, 0.)
      b_hb = tl.where((v_i < V), b_hb, 0.)
      tl.store(p_o, b_o.to(p_o.dtype.element_ty), mask=m_v)
      if STORE_FINAL_STATE:
      p_ht = ht + i_nh * K*V + o_k[:, None] * V + o_v[None, :]
      p_hbt = hbt + i_nh * V + o_v
      tl.store(p_ht, b_h.to(p_ht.dtype.element_ty), mask=m_h)
      tl.store(p_hbt, b_hb.to(p_hbt.dtype.element_ty), mask=o_v < V)
    timeout_sec: 900.0
    metadata:
      uid: CSAT146
      category: GPU Kernel to PyTorch API conversion
      sub_category: Triton attention to PyTorch
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        The conversion should reproduce the kernel's output and both final states using standard PyTorch operations compatible with OpenXLA. Each sequence and head should maintain independent matrix and bias states, initialized from the supplied states or zeros and carried forward between chunks. The reconstruction, normalization derivative and both causal output corrections should preserve the source's calculations and precision. Each output uses its own token's learning rate, while both state updates use the last valid token's rate in that chunk. Partial chunks must preserve the source's masking and padded row contributions to the bias reduction. Packed inputs must follow cu_seqlens, giving every sequence its own chunk boundaries and state updates.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The response implements the main forward calculation but mishandles the final state updates when the last chunk is incomplete. It pads eta with zeros, then selects the last padded position as the learning rate for both updates. This skips the final chunk's required matrix and bias updates, leaving incorrect states even when the output is correct. It also omits cu_seqlens and packed sequence processing, so it cannot reproduce the source's variable length mode.
      weight: 0.5
