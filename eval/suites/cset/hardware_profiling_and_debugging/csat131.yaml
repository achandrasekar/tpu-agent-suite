# CSAT131 from the "Hardware profiling and debugging" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat131
    prompt: |-
      i'm compiling this kernel on TPU with Helion v1.1.0, Pallas backend, pallas_loop_type="emit_pipeline", and block_sizes=[16,128,128,128]. The three inputs are bfloat16 tensors of shape (1024,1024). What causes the error below, and how can I fix it without changing the computation or loop configuration?
      @helion.kernel(
      static_shapes=True,
      )
      def squeeze_and_excitation_net_fwd(
      x: Tensor, a: Tensor, b: Tensor
      ) -> tuple[Tensor, Tensor, Tensor]:
      m, n = x.size()
      k = a.size(1)
      out = torch.empty([m, n], dtype=x.dtype, device=x.device)
      c = torch.empty([m, k], dtype=x.dtype, device=x.device)
      d = torch.empty([m, n], dtype=x.dtype, device=x.device)

      for tile_m in hl.tile(m):
          for tile_k in hl.tile(k):
              partial_xa = x[tile_m, :] @ a[:, tile_k]
              c[tile_m, tile_k] = torch.relu(partial_xa)

          for tile_n in hl.tile(n):
              acc = hl.zeros([tile_m, tile_n], dtype=torch.float32)
              for tile_k in hl.tile(k):
                  acc = torch.addmm(acc, c[tile_m, tile_k], b[tile_k, tile_n])
              d[tile_m, tile_n] = torch.sigmoid(acc)
              out[tile_m, tile_n] = x[tile_m, tile_n] * d[tile_m, tile_n]

      return out, c, d

      TypeError: add got incompatible shapes for broadcasting: (16, 128), (16, 1024)
    timeout_sec: 900.0
    metadata:
      uid: CSAT131
      category: Hardware profiling and debugging
      sub_category: Index map and grid errors
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        The answer should explain that Helion's inner emit_pipeline incorrectly retains the full column dimension of b when that dimension belongs to an enclosing non-grid loop. The correction should slice the pipeline reference to the current tile_n region and generate a (128,128) BlockSpec with indexing relative to that slice. It must preserve the current column offset, retain the inner k iteration, and avoid applying outer grid offsets twice. Applying the upstream compiler fix, or an equivalent correction, should preserve the requested computation and loop configuration.

        The corrected kernel should compile with emit_pipeline and block_sizes=[16,128,128,128]. It should return out, c, and d as bfloat16 tensors of shape (1024,1024), preserving c = relu(x @ a), d = sigmoid(c @ b), and out = x * d, including the original intermediate dtype conversions.

        The answer should explicitly trace c's (16,128) tile multiplied by b's incorrectly loaded (128,1024) block, producing (16,1024), which cannot be added to the (16,128) accumulator.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The response correctly recognizes a compiler tiling problem. and sharing a tile's block size is supported by Helion. However, it misidentifies the cause of this failure. The documented mismatch comes from b being loaded as (128,1024) because the inner pipeline does not account for the enclosing tile_n loop. Multiplying that block by c's (16,128) tile produces (16,1024), which cannot be added to the (16,128) accumulator. By source inspection, sharing the two k loops' block IDs does not restore the missing column slice and offset, so the proposed fix does not address the failure. The proposed fix also changes the requested loop configuration by making the second k loop share the first loop's block ID, despite the instruction to preserve that configuration.
      weight: 0.5
