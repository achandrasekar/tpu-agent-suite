# CSAT032 from the "Hardware profiling and debugging" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat032
    prompt: 'On TPU v6e-64, GLM-5.1 shows a performance regression between two versions
      while using dynamic W8A8 quantization. The workload uses tp64/dp8/ep64, 1K input
      and 1K output tokens, concurrency 460, random-range ratio 1.0, and memory fraction
      0.85. Earlier version: 2809 output tok/s, 130 ms median TPOT, 976384 KV-pool
      tokes; Affected version: 2187 output tok/s, 145.9 Ms median TPOT, 941568 KV-pool
      tokens. Identify the single implementation fault that best explains the full
      pattern. Trace how it produces each metric change, give the smallest safe correction,
      and name one decisive check that would distinguish it from the other changed
      decode paths.'
    timeout_sec: 900.0
    metadata:
      uid: CSAT032
      category: Hardware profiling and debugging
      sub_category: Memory bound and insufficient fusion
      difficulty: Hard
      has_code: 'No'
      baseline_result: Stumped
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        A strong answer should identify that MLP fusion occurs before dynamic W8A8 conversion, causing the affected fused weights to bypass quantization and remain BF16. It should connect the resulting extra weight memory and decode cost to the 34,816-token KV-pool loss and 15.9 ms TPOT increase, and note that the workload requires 942,080 tokens (460 x 2,048), which exceeds the regressed pool of 941,568 by 512 tokens, creating admission or scheduling pressure and making throughput fall more than TPOT alone. It should give the smallest safe fix: disable MLP fusion only for dynamic quantization while preserving it for unaffected configurations. A decisive check should rerun the same workload with MLP fusion disabled and verify that the affected weights become INT8 and that KV capacity and performance recover. The referenced merged solution to the issue is linked for more context.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The response misdiagnosed the regression as inefficient dynamic activation quantization creating persistent HBM intermediates. The actual issue is that the fused MLP weights bypass dynamic W8A8 conversion and remain BF16. As a result, its proposed fused quantization kernel does not address the source fault and is not the smallest safe correction. Its suggested HLO inspection also tests the wrong mechanism rather than confirming whether the affected weights were quantized. It also claimed, without HLO or memory-profile evidence, that the reduction, division, and cast operations necessarily cause separate HBM round trips and launch overhead. Furthermore, the helper calls in its proposed fix are not grounded in the source implementation, and its scratchpad explanation provides no memory accounting that could explain the measured 34,816-token KV-pool loss.
      weight: 0.5
