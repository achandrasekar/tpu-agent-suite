# CSAT128 from the "Hardware profiling and debugging" category of the CSAT question set as a Harbor task.

version: '1.0'
suite_name: cset
environment:
  base_image: python:3.12-slim
  pip_packages:
  - google-auth
  cpus: 2
  memory_mb: 8192
  storage_mb: 10240
  workdir: /workspace
evaluation:
  judge_model: vertex_ai/gemini-3.8-flash
  cases:
  - name: csat128
    prompt: |-
      My MoE training step fails during compilation on TPU v6e-4 with Pallas Megablox. The model has hidden_dim=32, intermediate_dim=128, 32 experts and 2 experts per token. Here is the error:

      "ValueError: The Pallas TPU lowering currently requires that the last two
      dimensions of your block shape are divisible by 8 and 128 respectively, or be
      equal to the respective dimensions of the overall array. Block spec for outputs
      in pallas_call kernel at .../pallas/ops/tpu/megablox/gmm.py:393 has block shape
      (Blocked(block_size=512), Blocked(block_size=32)), array shape (524288, 128)"
      The wrapper imports gmm from Jax.experimental.pallas.ops.tpu.megablox as _gmm_megablox.  On this device, _megablox_tile_size() returns (512,1024,1024). Here is the wrapper:

      def _ragged_dot_megablox_impl(lhs: jax.Array, rhs: jax.Array, group_sizes: jax.Array) -> jax.Array:
      if _gmm_megablox is None:
      raise NotImplementedError("megablox GMM is not available (TPU-only)")
      tile_size = _megablox_tile_size()
      m, k, n = lhs.shape[0], lhs.shape[1], rhs.shape[2]
      return _gmm_megablox(
      lhs,
      rhs,
      group_sizes,
      preferred_element_type=lhs.dtype,
      tiling=(min(m, tile_size[0]), min(k, tile_size[1]), min(n, tile_size[2])),
      interpret=jax.default_backend() == "cpu",
      )
      The same failure occurs with and without a "Session is closed" cache read warning. What is the smallest change to this wrapper that fixes the compilation failure while preserving Megablox, the model dimensions, and the computation dtype?
    timeout_sec: 900.0
    metadata:
      uid: CSAT128
      category: Hardware profiling and debugging
      sub_category: Shape and tiling violations
      difficulty: Hard
      has_code: 'Yes'
      baseline_result: Partially Solved
    expectations:
    - criterion: |-
        The agent's final answer to the user agrees with this reference answer on every substantive point (diagnosis, recommendation and any code or numbers), with no contradicting or technically incorrect claims:

        Pass tiling=_megablox_tiling, where the function accepts m,k, and n and clamps them to the existing device tile limits. This preserves the forward down projection's tile of (512,128,32) while selecting (512,32,128) for its input gradient. The gradient output block becomes (512,128), satisfying the reported alignment requirement. Preserve Megablox, the model dimensions, and the computation dtype. This is the solution implemented in merged PR #8719, linked.
      weight: 1.0
    - criterion: |-
        The agent's final answer avoids the mistakes a baseline model made on this question, described here:

        The model correctly explains that the backward pass reuses the forward tile. However, its proposed fix removes K/N clamping and uses a fixed (512,1024,1024) tile. The merged fix retains clamping and passes a callable that selects tiles using each operation's actual dimensions. The response therefore misses the merged reference fix(PR 8719), linked.
      weight: 0.5
